<!--
================================================================================
PLANTILLA PRINCIPAL DEL NAVEGADOR PEATONAL (MAP/INDEX.HTML)
================================================================================

Propósito del Archivo:
----------------------
Presenta la interfaz interactiva de JaguarMaps. Integra el visor cartográfico SVG
del campus universitario de la UAM, el panel de control de rutas (origen, destino,
accesibilidad en silla de ruedas ♿), el reproductor de voz con la Web Speech API
y la capa de pines interactivos georreferenciados (📍) de objetos extraviados.

Componentes que van en esta plantilla:
--------------------------------------
1. Panel Lateral de Controles de Navegación:
   - Selector de Punto de Partida (Origen):
     * Lista desplegable con Casetas de Entrada QR (GATE_1, GATE_2, GATE_3) y POIs principales.
     * Botón para geolocalizar automáticamente con GPS mediante Haversine.
   - Selector de Destino:
     * Agrupado por aulas del Edificio B (B-101 a B-106 de izquierda a derecha),
       baños de hombres y mujeres, clínicas de odontología (FODO), Edificio A y cafeterías.
   - Selector de Modo Accesible (♿):
     * Interruptor (toggle) para personas con discapacidad física o movilidad reducida.
     * Al activarse, instruye al algoritmo de Dijkstra para omitir aristas con escaleras.
   - Botón de Trazar Ruta ('Calcular Camino Óptimo'):
     * Realiza petición fetch() a /api/ruta.
   - Resumen de Ruta Calculada:
     * Métricas de distancia total en metros y tiempo estimado de caminata.
   - Controles de Síntesis de Voz (Web Speech API):
     * Botón 'Escuchar Instrucciones' (🔊) para reproducir la guía paso a paso por audio.
     * Botón de Pausar / Detener audio.
     * Lista secuencial de pasos para lectura visual.

2. Visor Cartográfico Vectorial (Lienzo SVG):
   - Plano esquemático y arquitectónico del campus universitario de la UAM.
   - Capa de Aristas y Conexiones Peatonales:
     * Líneas entre nodos transitables con distancias en metros.
   - Capa de Nodos y Vértices Físicos:
     * Círculos interactivos coloreados según categoría (Entradas, Aulas B, Servicios, Clínicas).
   - Capa de Ruta Activa:
     * Polilínea vectorial SVG animada con stroke-dasharray para mostrar la ruta calculada por Dijkstra.
   - Capa de Pines Georreferenciados de Objetos Extraviados (📍):
     * Marcadores animados en color rojo sobre los nodos donde se encuentran pertenencias en custodia.
     * Al hacer clic en un pin, despliega un modal o tarjeta emergente con:
       - Nombre del artículo y categoría.
       - Lugar y fecha de reporte.
       - Botón directo para iniciar el trámite de reclamo en el Edificio A.

3. Bloque de Scripts JavaScript:
   - Carga de 'static/js/ttsHelper.js' (controlador de la Web Speech API).
   - Carga de 'static/js/mapaInteractivo.js' (lógica del visor SVG, consumo de /api/ruta y pines).
-->
