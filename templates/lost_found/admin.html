<!--
================================================================================
PLANTILLA DEL CUADERNO DIGITAL DE CUSTODIA DEL EDIFICIO A (ADMIN.HTML)
================================================================================

Propósito del Archivo:
----------------------
Es el panel de control exclusivo para el personal con rol de ADMINISTRADOR
en la recepción del Edificio A. Sustituye el antiguo cuaderno físico de papel,
permitiendo auditar todos los reportes, recibir objetos físicos en resguardo,
inspeccionar el secreto confidencial antifraude y asentar la entrega formal al dueño.

Componentes que van en esta plantilla:
--------------------------------------
1. Cabecera y Enlace a Gestión de Usuarios:
   - Título: 'Cuaderno Oficial de Custodia de Objetos - Recepción Edificio A'.
   - Botón de navegación al panel de cuentas: 'Administrar Usuarios y Roles' (/lost-found/admin/usuarios).

2. Tarjetas de Resumen y Métricas de Custodia:
   - Total de objetos en estado 'REPORTADO' (pendientes de llegar a ventanilla).
   - Total de objetos en estado 'VERIFICADO' (en vitrinas bajo custodia física activa).
   - Total de objetos en estado 'ENTREGADO' (resueltos satisfactoriamente).

3. Filtros Rápidos de la Bandeja:
   - Botones para filtrar por estado (Todos, Reportados, Verificados, Entregados).
   - Buscador por palabra clave, fecha o lugar.

4. Tabla Auditable de Objetos en Custodia:
   - Columnas de la tabla:
     * ID de Ticket.
     * Artículo y Categoría.
     * Lugar y Fecha de Hallazgo.
     * Usuario que Reporta (Nombre, Correo, Cédula/CIF).
     * ESTADO ACTUAL con distintivo de color.
     * DETALLE SECRETO DE VALIDACIÓN:
       - Celda exclusiva para el Administrador con fondo resaltado en color púrpura o ámbar,
         mostrando el dato confidencial que debe exigir oralmente al estudiante/visitante.
     * Acciones de Transición de Estados:
       - Si está 'REPORTADO':
         * Botón 'Confirmar Recepción Física': Cambia el estado a 'VERIFICADO' e ingresa el bien a custodia.
       - Si está 'VERIFICADO':
         * Botón 'Entregar a Dueño': Abre modal de entrega.
       - Si está 'ENTREGADO':
         * Muestra fecha de entrega, identificación del receptor y nota de descargo.

5. Modal / Formulario de Entrega al Dueño Legítimo:
   - Formulario para asentar la entrega formal:
     * Identificación del reclamante (búsqueda de usuario por correo, CIF o cédula).
     * Verificación verbal exitosa del detalle secreto.
     * Campo para 'Nota de Entrega / Acta de Descargo' del recepcionista.
     * Botón 'Confirmar y Archivar Entrega'.
-->
