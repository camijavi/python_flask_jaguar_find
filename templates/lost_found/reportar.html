<!--
================================================================================
PLANTILLA DE REPORTE DE OBJETO ENCONTRADO (REPORTAR.HTML)
================================================================================

Propósito del Archivo:
----------------------
Presenta el formulario estructurado para que cualquier miembro de la comunidad
universitaria (Estudiante, Colaborador o Visitante autenticado) registre una pertenencia
que ha encontrado dentro del campus de la UAM.

Componentes que van en esta plantilla:
--------------------------------------
1. Cabecera Orientativa:
   - Título: 'Reportar Objeto Encontrado'.
   - Instrucciones sobre el proceso de entrega de pertenencias en el Edificio A.

2. Campos del Formulario (POST a /lost-found/reportar):
   - Título del Artículo:
     * Nombre general y descriptivo (ej. 'Calculadora Casio fx-991', 'Termo Metálico Azul').
   - Categoría:
     * Selector: Electrónicos, Documentos/Carnets, Útiles y Libros, Ropa/Accesorios, Otros.
   - Ubicación del Hallazgo (Lugar / Nodo del Campus):
     * Desplegable con los nodos del campus (Edificio B - Aulas B-101 a B-106, Edificio A,
       Plaza Central, Cafeterías, Clínicas FODO, etc.).
     * Botón opcional para autocompletar con la ubicación GPS más cercana mediante Haversine.
   - Fecha y Hora del Hallazgo:
     * Selector de fecha del día en que se encontró el artículo.
   - Descripción Pública General:
     * Campo textarea para características exteriores genéricas visibles para todos
       (ej. 'Calculadora color negro con tapa protectora, encontrada sobre mesa de clase').
   - CAMPO CONFIDENCIAL ANTIFRAUDE: Detalle Secreto de Validación:
     * Campo textarea obligatorio acompañado de un aviso de seguridad en color ámbar:
       "Escribe un detalle particular, rayón, fondo de pantalla bloqueado, iniciales o contenido interior
        que solo el dueño real conozca. Este dato NUNCA será visible al público; solo lo verá el recepcionista
        del Edificio A para verificar al dueño legítimo."

3. Flujo Posterior al Envío:
   - Recordatorio al usuario:
     "Al completar este formulario, el objeto queda registrado en estado 'REPORTADO'.
      Por favor dirígete a la recepción del Edificio A para hacer la entrega física del artículo
      y pasarlo a custodia oficial ('VERIFICADO')."

4. Botones de Acción:
   - Botón 'Registrar Reporte' (envío de formulario).
   - Botón 'Cancelar' (regresa al catálogo).
-->
