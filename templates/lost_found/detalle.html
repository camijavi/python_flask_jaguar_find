<!--
================================================================================
PLANTILLA DE FICHA DE DETALLE DE OBJETO EXTRAVIADO (DETALLE.HTML)
================================================================================

Propósito del Archivo:
----------------------
Muestra la información pública de un objeto específico registrado en JaguarFind.
Brinda al estudiante o visitante los detalles no confidenciales necesarios para
reconocer si es su pertenencia y las instrucciones paso a paso para personarse
en la recepción del Edificio A a tramitar su devolución.

Componentes que van en esta plantilla:
--------------------------------------
1. Cabecera y Navegación:
   - Enlace de retorno al catálogo: '← Volver al Catálogo'.
   - Identificador del ticket de objeto (#ID).

2. Ficha Principal del Objeto:
   - Título del artículo y categoría destacada.
   - Distintivo visual del estado de custodia:
     * 'REPORTADO': En camino al Edificio A por quien lo halló.
     * 'VERIFICADO': En resguardo oficial en las vitrinas/casilleros de custodia del Edificio A.
     * 'ENTREGADO': Ya devuelto a su dueño legítimo.
   - Información de Espacio y Tiempo:
     * Lugar de hallazgo: Nodo físico del campus (ej. Aula B-103).
     * Fecha de reporte: Fecha del calendario.
   - Descripción Pública:
     * Texto con las características exteriores visibles.
   - Imagen o Placeholder de categoría.

3. Protocolo Antifraude para Reclamo Físico (Paso a Paso):
   - Caja destacada con instrucciones para el dueño:
     * Paso 1: Dirígete a la recepción principal del Edificio A.
     * Paso 2: Presenta tu carnet institucional UAM (Estudiante/Colaborador) o tu Cédula nacional (Visitante).
     * Paso 3: Responde oralmente a la pregunta sobre el 'Detalle Secreto' (ej. fondo de pantalla,
       rayón, pegatinas o contenido interior). El recepcionista confrontará tu respuesta con el sistema.
     * Paso 4: Firma el acta digital de descargo de recepción y recupera tu pertenencia.

4. Botón de Geolocalización en el Mapa:
   - Botón 'Ver Ubicación en JaguarMaps': Redirige a /mapa con el nodo del objeto preseleccionado
     para mostrar la ruta peatonal hacia el lugar del hallazgo o hacia el Edificio A.
-->
