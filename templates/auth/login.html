Componentes que van en esta plantilla:
--------------------------------------
1. Cabecera Visual:

   - Pestaña 1: '🏛️ Comunidad UAM' (Estudiantes, Colaboradores y Administradores).

3. Formulario 1: Acceso Institucional (Comunidad UAM):

     * Entrada tipo email.

     * Etiqueta y texto de ayuda recordando el dominio obligatorio @uamv.edu.ni.
   - Campo 'password':
     * Entrada tipo password, mínimo 6 caracteres.
   - Botón 'Ingresar al Sistema':
     * Envía POST hacia /auth/login con tipoAcceso = 'institucional'.

4. Formulario 2: Acceso Visitante (Passwordless):
   - Recuadro explicativo informando que los visitantes no requieren contraseña
     y pueden consultar el estado de sus pertenencias solo con su correo y cédula.
   - Campo 'correo_visitante':
     * Entrada tipo email para correos personales (Gmail, Outlook, Yahoo, etc.).
   - Campo 'cedula_visitante':
     * Entrada de texto para número de cédula o documento de identidad oficial.
   - Botón 'Ingresar como Visitante':
     * Envía POST hacia /auth/login con tipoAcceso = 'visitante'.
