<!--
================================================================================
PLANTILLA DE REGISTRO DE NUEVO USUARIO (SIGNUP.HTML)
================================================================================

Propósito del Archivo:
----------------------
Presenta la interfaz dinámica de autoregistro para los 3 roles públicos de JaguarFind:
Estudiante, Colaborador y Visitante. Adapta los campos requeridos en tiempo real
según el tipo de usuario seleccionado mediante JavaScript.

Componentes y Secciones que van en esta plantilla:
-------------------------------------------------
1. Cabecera y Título:
   - {{ t('auth.sign_up_title') }}.
   - Mensaje orientativo sobre el registro para reportar y reclamar objetos extraviados.

2. Selector de Rol (<select id="selectRol">):
   - Opción: ESTUDIANTE (Estudiante activo de la UAM).
   - Opción: COLABORADOR (Personal docente, administrativo o de servicios generales).
   - Opción: VISITANTE (Padres de familia, pacientes de clínicas odontológicas, público de eventos).
   - Nota visible: El rol de ADMINISTRADOR no se auto-asigna; es controlado por la recepción del Edificio A.

3. Datos Generales Comunes:
   - Nombre Completo (mínimo 3 caracteres).
   - Correo Electrónico:
     * Si es Estudiante/Colaborador: Exige dominio institucional @uamv.edu.ni.
     * Si es Visitante: Acepta cualquier correo personal válido (Gmail, Hotmail, etc.).
   - Contraseña:
     * Si es Estudiante/Colaborador: Obligatoria (>= 6 caracteres).
     * Si es Visitante: SE OCULTA COMPLETAMENTE (no requiere contraseña).

4. Sección Dinámica para ESTUDIANTE:
   - Número CIF: Campo numérico de exactamente 8 dígitos (pattern="^\\d{8}$").
   - Facultad Principal: Desplegable con las facultades de la UAM (FIA, FCE, FCJ, FODO, MED).
   - Carrera Principal: Campo de texto (ej. Ingeniería en Sistemas de Información).
   - Módulo de Doble Titulación (Opcional - Máximo 2 Carreras):
     * Desplegable para Segunda Facultad.
     * Campo para Segunda Carrera (ej. Marketing y Publicidad).

5. Sección Dinámica para COLABORADOR:
   - Campo para Cédula de Identidad Nacional (obligatorio para personal docente/administrativo).

6. Sección Dinámica para VISITANTE:
   - Banner explicativo de Acceso Simplificado (Passwordless).
   - Campo para Cédula de Identidad o Documento Oficial (para validar su identidad al reclamar un objeto).
   - Alerta informativa sobre la Política de Privacidad y Retención:
     "Tu cuenta es temporal y se depurará automáticamente tras 6 meses de inactividad."

7. Botón de Enlace y Submit:
   - Botón de envío que sincroniza los campos antes de hacer POST a /auth/signup.
   - Enlace inferior para usuarios que ya tienen cuenta: /auth/login.

8. Bloque de Scripts JavaScript:
   - Escucha el evento 'change' en selectRol.
   - Alterna las clases 'hidden' y los atributos 'required' de los campos según el rol seleccionado.
-->
