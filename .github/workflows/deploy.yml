name: Deploy JaguarFind

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m tests.testCampusGraph

      - name: Package application
        run: |
          chmod +x startup.sh
          zip -r "$RUNNER_TEMP/jaguarfind.zip" . \
            -x '.git/*' '.venv/*' '__pycache__/*' '*.pyc' \
               '.pytest_cache/*' '.DS_Store' '.env*' 'jaguarFind.db'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --src-path "$RUNNER_TEMP/jaguarfind.zip" \
            --type zip

      - name: Verify deployment
        env:
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          curl --fail --retry 12 --retry-connrefused --retry-delay 5 \
            "https://${WEBAPP_NAME}.azurewebsites.net/api/health"
