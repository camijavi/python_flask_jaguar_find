<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="../../static/css/screens/auth/userOptions.css"/>
    <title>user options</title>
</head>
<body>
    <section class="user_options">
    <div class="student">
        <h1>Estudiante</h1>
        <p>Con tu correo @uamv.edu.ni y tu CIF</p>
        <a class="btn" href="/auth/signup?rol=estudiante">Acceder</a>
    </div>

    <div class="collaborator">
        <h1>Colaborador</h1>
        <p>Docentes, administrativos y servicios generales</p>
        <a class="btn" href="/auth/signup?rol=colaborador">Acceder</a>
    </div>

    <div class="visitor">
        <h1>Visitante</h1>
        <p>Sin contraseña, solo correo y cédula</p>
        <a class="btn" href="/auth/signup?rol=visitante">Acceder</a>
    </div>
</section>

    
</body>
</html>
