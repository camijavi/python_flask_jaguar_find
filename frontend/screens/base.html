<!DOCTYPE html>
<html lang="{{ current_language }}" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title{% block title_attrs %} data-i18n="app.name"{% endblock %}>{% block title %}{{ t('app.name') }}{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/jaguarLogo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/jaguarLogo.png') }}">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            future: {
                hoverOnlyWhenSupported: true
            },
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef7f8',
                            100: '#daedef',
                            200: '#b6dbe1',
                            300: '#8dc7cf',
                            400: '#5dafbb',
                            500: '#2f99a8',
                            600: '#28828f',
                            700: '#206872',
                            800: '#185057',
                            900: '#11373c',
                        },
                        ocean: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#bae0fd',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',
                            900: '#1e3a8a',
                        },
                        jaguar: {
                            gold: '#f59e0b',
                            amber: '#d97706',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom Animated Styles (Vector Routes) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- Google Fonts: Plus Jakarta Sans / Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* Animated SVG route line */
        .ruta-animada {
            stroke-dasharray: 8, 4;
            animation: dash 1s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -12;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="h-full min-h-full flex flex-col text-slate-800 antialiased selection:bg-brand-500 selection:text-white">

    <!-- INSTITUTIONAL NAVBAR -->
    {% include "components/common/navBar.html" %}

    <!-- MAIN CONTENT VIEW -->
    <main class="flex-1 flex flex-col min-h-0">
        {% block content %}{% endblock %}
    </main>

    <!-- CLIENT-SIDE i18n & APP CONFIG SCRIPT -->
    <script>
        // Global client-side translation registry from backend/i18n.py
        window.APP_CONFIG = {
            currentLang: "{{ current_language }}",
            endpoints: {
                mapNodes: "/api/map/nodes",
                mapCategories: "/api/map/categories",
                mapPlaces: "/api/map/places",
                mapRoute: "/api/map/route",
                nearestGps: "/api/map/nearest-gps",
                mapBoundaries: "/api/map/boundaries",
                buildingLocations: "/api/map/buildings"
            }
        };

        window.APP_TRANSLATIONS = {{ (i18n_dict or {})|tojson }};
    </script>

    <!-- Scoped sessionStorage Form Draft Persistence & Reactive Client-Side i18n -->
    <script src="{{ url_for('static', filename='js/formDraftManager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18nManager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/passwordVisibilityToggle.js') }}"></script>

    <!-- Shared Browser Geolocation API, Permission & Campus Location Detector -->
    <script src="{{ url_for('static', filename='js/gpsLocationDetector.js') }}"></script>
    <!-- Shared Canonical Campus Room & Facility Search Engine -->
    <script src="{{ url_for('static', filename='js/campusSearchHelper.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
