<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="lost_found.uploader.page_title">{{ t('lost_found.uploader.page_title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/lostFoundObject/imageUploader.css') }}">
</head>
<body>
    <h2 data-i18n="lost_found.uploader.heading">{{ t('lost_found.uploader.heading') }}</h2>
    <form action="upload.php" method="post" enctype="multipart/form-data">
        <label for="fileUpload" data-i18n="lost_found.uploader.choose_image">{{ t('lost_found.uploader.choose_image') }}</label>
        <input type="file" id="fileUpload" name="photo" accept="image/*">

        <div class="imageUploader">
            <span class="imageUploader__placeholder" id="placeholder" data-i18n="lost_found.uploader.no_image">{{ t('lost_found.uploader.no_image') }}</span>
            <img class="imageUploader__preview" id="preview" alt="{{ t('lost_found.uploader.preview_alt') }}" data-i18n-alt="lost_found.uploader.preview_alt">
        </div>

        <input type="submit" value="{{ t('lost_found.uploader.upload_btn') }}" data-i18n-value="lost_found.uploader.upload_btn">
    </form>

    <script src="{{ url_for('static', filename='js/imageUploader.js') }}"></script>
</body>
</html>
