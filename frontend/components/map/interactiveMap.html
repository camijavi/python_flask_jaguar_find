<!--
================================================================================
INTERACTIVEMAP COMPONENT (INTERACTIVEMAP.HTML)
================================================================================
Vector SVG Campus Map rendering UAM buildings, pedestrian walkways,
Dijkstra animated route paths (.ruta-animada), wheelchair accessible ramps,
and georeferenced Lost & Found object pins (📍).
================================================================================
-->

<div id="interactiveMapContainer" class="relative w-full h-[620px] bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-slate-800 flex flex-col select-none">
    
    <!-- Map Toolbar (Zoom & Controls) -->
    <div class="absolute top-4 right-4 z-20 flex flex-col gap-1.5 bg-slate-800/90 backdrop-blur-md p-1.5 rounded-xl border border-slate-700/80 shadow-lg">
        <button id="btnZoomIn" type="button" class="w-8 h-8 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-white flex items-center justify-center font-bold text-sm transition-colors" title="Zoom In">
            +
        </button>
        <button id="btnZoomOut" type="button" class="w-8 h-8 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-white flex items-center justify-center font-bold text-sm transition-colors" title="Zoom Out">
            −
        </button>
        <button id="btnResetView" type="button" class="w-8 h-8 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-white flex items-center justify-center text-xs transition-colors" title="Centrar Mapa">
            🎯
        </button>
    </div>

    <!-- Map Legend Badge -->
    <div class="absolute bottom-4 left-4 z-20 bg-slate-800/90 backdrop-blur-md px-3 py-2 rounded-xl border border-slate-700/80 text-[11px] text-slate-300 flex items-center gap-4 shadow-lg">
        <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-brand-500 inline-block"></span>
            <span>Edificios UAM</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
            <span>Rutas / Rampas ♿</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>
            <span>Objetos Perdidos 📍</span>
        </div>
    </div>

    <!-- Active Pin / Building Popover (Hidden by default) -->
    <div id="mapPopover" class="absolute z-30 bg-white rounded-xl shadow-2xl border border-slate-200 p-3.5 max-w-xs text-xs text-slate-800 hidden transition-all pointer-events-auto">
        <div class="flex items-start justify-between gap-2 mb-1.5">
            <div id="popoverTitle" class="font-bold text-slate-900 text-sm"></div>
            <button id="btnClosePopover" type="button" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
        </div>
        <div id="popoverDetails" class="text-slate-600 space-y-1 mb-2.5"></div>
        <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <button id="btnSetAsOrigin" type="button" class="flex-1 py-1 px-2 rounded-md bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-[10px] text-center transition-colors">
                🟢 {{ t('map.where_am_i', default='Establecer Origen') }}
            </button>
            <button id="btnSetAsDestination" type="button" class="flex-1 py-1 px-2 rounded-md bg-brand-50 hover:bg-brand-100 text-brand-800 font-bold text-[10px] text-center transition-colors">
                🏁 {{ t('map.where_to_go', default='Establecer Destino') }}
            </button>
        </div>
    </div>

    <!-- SVG Vector Canvas -->
    <svg id="campusSvgMap" viewBox="0 0 1000 700" class="w-full h-full cursor-grab active:cursor-grabbing">
        <defs>
            <!-- Campus Grid Pattern -->
            <pattern id="campusGrid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
            </pattern>

            <!-- Radial glow for nodes -->
            <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
            </radialGradient>
        </defs>

        <!-- Background Campus Grounds -->
        <rect width="1000" height="700" fill="#0f172a" />
        <rect width="1000" height="700" fill="url(#campusGrid)" />

        <!-- Green Spaces & Campus Courtyard Outlines -->
        <g id="campusGreenAreas" opacity="0.25">
            <rect x="220" y="240" width="180" height="130" rx="15" fill="#10b981" />
            <rect x="620" y="160" width="220" height="150" rx="20" fill="#10b981" />
            <circle cx="500" cy="350" r="60" fill="#059669" />
        </g>

        <!-- Static Walkways Layer -->
        <g id="walkwaysLayer" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"></g>

        <!-- Dynamic Dijkstra Animated Route Polyline -->
        <g id="routeLayer">
            <!-- Glow background line -->
            <polyline id="routeGlowPolyline" points="" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
            <!-- Main animated dash line -->
            <polyline id="routePolyline" points="" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" class="ruta-animada" />
        </g>

        <!-- Macro Campus Building Nodes Layer -->
        <g id="nodesLayer"></g>

        <!-- Origin (🟢) & Destination (🏁) Pin Markers -->
        <g id="routePinsLayer">
            <g id="originPinGroup" class="hidden"></g>
            <g id="destinationPinGroup" class="hidden"></g>
        </g>

        <!-- Georeferenced Lost & Found Object Pins Layer (📍) -->
        <g id="lostFoundPinsLayer"></g>
    </svg>

</div>

<!-- JAVASCRIPT LOGIC FOR INTERACTIVEMAP -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const svg = document.getElementById("campusSvgMap");
    const walkwaysLayer = document.getElementById("walkwaysLayer");
    const nodesLayer = document.getElementById("nodesLayer");
    const routePolyline = document.getElementById("routePolyline");
    const routeGlowPolyline = document.getElementById("routeGlowPolyline");
    const lostFoundPinsLayer = document.getElementById("lostFoundPinsLayer");
    const originPinGroup = document.getElementById("originPinGroup");
    const destinationPinGroup = document.getElementById("destinationPinGroup");

    const popover = document.getElementById("mapPopover");
    const popoverTitle = document.getElementById("popoverTitle");
    const popoverDetails = document.getElementById("popoverDetails");
    const btnClosePopover = document.getElementById("btnClosePopover");
    const btnSetAsOrigin = document.getElementById("btnSetAsOrigin");
    const btnSetAsDestination = document.getElementById("btnSetAsDestination");

    let activeSelectedNode = null;
    let nodesById = {};

    // Coordinates conversion: Percentage (0-100%) to SVG viewBox (1000 x 700)
    function toSvgCoords(xPercent, yPercent) {
        return {
            x: (xPercent / 100) * 1000,
            y: (yPercent / 100) * 700
        };
    }

    // 1. Fetch & Render All Campus Nodes and Edges
    async function initMap() {
        try {
            const lang = window.APP_CONFIG.currentLang || "spa";
            const res = await fetch(`/api/map/nodes?lang=${lang}`);
            const data = await res.json();
            if (!data.success) return;

            nodesById = {};
            data.nodes.forEach(n => nodesById[n.nodeId] = n);

            renderWalkways(data.nodes);
            renderNodes(data.nodes);
            loadLostFoundMapPins();
        } catch (err) {
            console.error("Failed to load map data:", err);
        }
    }

    // 2. Render Static Walkways
    function renderWalkways(nodes) {
        walkwaysLayer.innerHTML = "";
        const drawnEdges = new Set();

        nodes.forEach(u => {
            const uPos = toSvgCoords(u.xPercent, u.yPercent);
            (u.adjacentEdges || []).forEach(edge => {
                const v = nodesById[edge.targetNodeId];
                if (!v) return;

                const edgeKey = [u.nodeId, v.nodeId].sort().join("--");
                if (drawnEdges.has(edgeKey)) return;
                drawnEdges.add(edgeKey);

                const vPos = toSvgCoords(v.xPercent, v.yPercent);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", uPos.x);
                line.setAttribute("y1", uPos.y);
                line.setAttribute("x2", vPos.x);
                line.setAttribute("y2", vPos.y);
                walkwaysLayer.appendChild(line);
            });
        });
    }

    // 3. Render Campus Building Footprints / Nodes
    function renderNodes(nodes) {
        nodesLayer.innerHTML = "";

        nodes.forEach(node => {
            const pos = toSvgCoords(node.xPercent, node.yPercent);
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "cursor-pointer group");
            g.setAttribute("data-node-id", node.nodeId);

            // Outer glowing ring
            const glow = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            glow.setAttribute("cx", pos.x);
            glow.setAttribute("cy", pos.y);
            glow.setAttribute("r", "16");
            glow.setAttribute("fill", "#0284c7");
            glow.setAttribute("opacity", "0.2");
            glow.setAttribute("class", "group-hover:opacity-60 transition-opacity");

            // Main node circle
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", pos.x);
            circle.setAttribute("cy", pos.y);
            circle.setAttribute("r", "9");
            circle.setAttribute("fill", node.category === "parkingGate" ? "#f59e0b" : "#38bdf8");
            circle.setAttribute("stroke", "#ffffff");
            circle.setAttribute("stroke-width", "2");
            circle.setAttribute("class", "group-hover:scale-125 transition-transform origin-center");

            // Node Label
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", pos.x);
            text.setAttribute("y", pos.y + 22);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("fill", "#cbd5e1");
            text.setAttribute("font-size", "11");
            text.setAttribute("font-weight", "600");
            text.setAttribute("class", "select-none pointer-events-none group-hover:fill-white");
            text.textContent = node.name.split("(")[0].trim();

            g.appendChild(glow);
            g.appendChild(circle);
            g.appendChild(text);

            // Popover event
            g.addEventListener("click", (e) => {
                showNodePopover(node, pos, e);
            });

            nodesLayer.appendChild(g);
        });
    }

    // 4. Popover Interaction
    function showNodePopover(node, pos, e) {
        activeSelectedNode = node;
        popoverTitle.textContent = node.name;
        popoverDetails.innerHTML = `
            <div><strong>Categoría:</strong> ${node.category}</div>
            <div><strong>Piso:</strong> ${node.floorLevel}</div>
            <div><strong>Nivel de Acceso:</strong> ${node.accessLevel}</div>
            ${node.accessNotice ? `<div class="p-1.5 rounded bg-amber-50 text-amber-800 text-[10px] mt-1">${node.accessNotice}</div>` : ''}
        `;

        // Position popover
        const rect = svg.getBoundingClientRect();
        const clientX = (pos.x / 1000) * rect.width;
        const clientY = (pos.y / 700) * rect.height;

        popover.style.left = `${Math.min(clientX + 10, rect.width - 240)}px`;
        popover.style.top = `${Math.min(clientY - 50, rect.height - 180)}px`;
        popover.classList.remove("hidden");
    }

    btnClosePopover.addEventListener("click", () => {
        popover.classList.add("hidden");
    });

    btnSetAsOrigin.addEventListener("click", () => {
        if (!activeSelectedNode) return;
        const originInput = document.getElementById("originInput");
        if (originInput) {
            originInput.value = activeSelectedNode.name;
            originInput.dispatchEvent(new Event("input"));
        }
        popover.classList.add("hidden");
    });

    btnSetAsDestination.addEventListener("click", () => {
        if (!activeSelectedNode) return;
        const destInput = document.getElementById("destinationInput");
        if (destInput) {
            destInput.value = activeSelectedNode.name;
            destInput.dispatchEvent(new Event("input"));
        }
        popover.classList.add("hidden");
    });

    // 5. Load Lost & Found Pins on Campus Map
    async function loadLostFoundMapPins() {
        try {
            const res = await fetch("/api/lost-found-object/map-pins");
            const data = await res.json();
            if (!data.success || !data.pins) return;

            lostFoundPinsLayer.innerHTML = "";
            data.pins.forEach(pin => {
                const node = nodesById[pin.locationNodeId];
                if (!node) return;

                const pos = toSvgCoords(node.xPercent, node.yPercent);
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "cursor-pointer group pin-pulse");

                // Amber pin circle
                const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                c.setAttribute("cx", pos.x);
                c.setAttribute("cy", pos.y - 12);
                c.setAttribute("r", "10");
                c.setAttribute("fill", "#ea580c");
                c.setAttribute("stroke", "#ffffff");
                c.setAttribute("stroke-width", "2");

                // Badge count inside pin
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", pos.x);
                t.setAttribute("y", pos.y - 8);
                t.setAttribute("text-anchor", "middle");
                t.setAttribute("fill", "#ffffff");
                t.setAttribute("font-size", "10");
                t.setAttribute("font-weight", "bold");
                t.textContent = pin.itemsCount;

                g.appendChild(c);
                g.appendChild(t);

                g.addEventListener("click", () => {
                    const itemsDesc = pin.items.map(i => `• ${i.itemName} (${i.stateName})`).join("<br>");
                    activeSelectedNode = node;
                    popoverTitle.textContent = `📦 ${pin.locationName}`;
                    popoverDetails.innerHTML = `
                        <div class="font-bold text-amber-800 text-[11px] mb-1">${pin.itemsCount} Objetos Reportados Aquí:</div>
                        <div class="text-[10px] text-slate-700 max-h-24 overflow-y-auto">${itemsDesc}</div>
                    `;
                    showNodePopover(node, pos);
                });

                lostFoundPinsLayer.appendChild(g);
            });
        } catch (e) {
            console.warn("Could not load lost found map pins:", e);
        }
    }

    // 6. Global Event: Draw Polyline when Route is Calculated
    window.addEventListener("jaguarMapRouteCalculated", function(e) {
        const route = e.detail;
        if (!route || !route.pathCoordinates || route.pathCoordinates.length < 2) return;

        const points = route.pathCoordinates.map(coord => {
            const pos = toSvgCoords(coord.xPercent, coord.yPercent);
            return `${pos.x},${pos.y}`;
        }).join(" ");

        routePolyline.setAttribute("points", points);
        routeGlowPolyline.setAttribute("points", points);

        // Draw Origin Pin (🟢)
        const start = route.pathCoordinates[0];
        const startPos = toSvgCoords(start.xPercent, start.yPercent);
        originPinGroup.innerHTML = `
            <circle cx="${startPos.x}" cy="${startPos.y}" r="12" fill="#10b981" opacity="0.4" class="animate-ping" />
            <circle cx="${startPos.x}" cy="${startPos.y}" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
        `;
        originPinGroup.classList.remove("hidden");

        // Draw Destination Pin (🏁)
        const end = route.pathCoordinates[route.pathCoordinates.length - 1];
        const endPos = toSvgCoords(end.xPercent, end.yPercent);
        destinationPinGroup.innerHTML = `
            <circle cx="${endPos.x}" cy="${endPos.y}" r="14" fill="#ef4444" opacity="0.3" class="animate-ping" />
            <circle cx="${endPos.x}" cy="${endPos.y}" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" />
            <text x="${endPos.x}" y="${endPos.y - 14}" text-anchor="middle" font-size="14">🏁</text>
        `;
        destinationPinGroup.classList.remove("hidden");
    });

    // 7. Global Event: Clear Route
    window.addEventListener("jaguarMapRouteCleared", function() {
        routePolyline.setAttribute("points", "");
        routeGlowPolyline.setAttribute("points", "");
        originPinGroup.classList.add("hidden");
        destinationPinGroup.classList.add("hidden");
        popover.classList.add("hidden");
    });

    // Zoom & Reset Handlers
    let currentScale = 1;
    document.getElementById("btnZoomIn").addEventListener("click", () => {
        currentScale = Math.min(currentScale + 0.2, 2.5);
        svg.style.transform = `scale(${currentScale})`;
    });
    document.getElementById("btnZoomOut").addEventListener("click", () => {
        currentScale = Math.max(currentScale - 0.2, 0.8);
        svg.style.transform = `scale(${currentScale})`;
    });
    document.getElementById("btnResetView").addEventListener("click", () => {
        currentScale = 1;
        svg.style.transform = "scale(1)";
    });

    initMap();
});
</script>
