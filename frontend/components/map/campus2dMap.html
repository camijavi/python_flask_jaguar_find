<!--
================================================================================
CAMPUS2DMAP COMPONENT (CAMPUS2DMAP.HTML)
================================================================================
Official UAM 2D Vector Campus Map faithfully replicating the official signage:
- Flat architectural building layouts (A, B, C, D, E, F, G, H, I, J, K, L, M, N, O, P)
- Real sports facilities: Baseball Stadium, Soccer Field, Jaguar Center, Jaguar Gym, Courts
- Plaza Central Rubén Darío, Plaza Chilamates, Ranchón, Weather Station, Parking & Tree rows
- Pedestrian walkway network and animated Dijkstra route path
- Official letter badges and orientation compass rose
- Clean flat architectural colors (pure 2D vector view)
================================================================================
-->

<div class="campus-map-wrapper" id="campusMapWrapper">

    <!-- Map Toolbar (Zoom, Center, Toggle Labels) -->
    <div class="absolute top-4 right-4 z-20 flex flex-col gap-1.5 bg-white/90 backdrop-blur-md p-1.5 rounded-xl border border-slate-200/90 shadow-md">
        <button id="btnMapZoomIn" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm transition-colors" title="Acercar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
        <button id="btnMapZoomOut" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm transition-colors" title="Alejar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
        </button>
        <button id="btnMapResetView" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center text-xs transition-colors" title="Centrar Mapa">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"></circle><circle cx="12" cy="12" r="3" stroke-width="2"></circle><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3m10-10h-3M5 12H2"></path></svg>
        </button>
    </div>

    <!-- Active Building Popover -->
    <div id="bldgPopover" class="absolute z-30 bg-white rounded-xl shadow-2xl border border-slate-200 p-4 max-w-xs text-xs text-slate-800 hidden transition-all pointer-events-auto">
        <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
                <span id="popoverBadge" class="w-6 h-6 rounded-md flex items-center justify-center text-white font-extrabold text-xs"></span>
                <span id="popoverName" class="font-bold text-slate-900 text-sm leading-tight"></span>
            </div>
            <button id="btnCloseBldgPopover" type="button" class="text-slate-400 hover:text-slate-600">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="popoverFacilities" class="text-slate-600 text-[11px] space-y-1 mb-3 max-h-32 overflow-y-auto pr-1"></div>
        <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <button id="btnSetBldgOrigin" type="button" class="flex-1 py-1.5 px-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-[10px] text-center transition-colors inline-flex items-center justify-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                <span>Origen</span>
            </button>
            <button id="btnSetBldgDestination" type="button" class="flex-1 py-1.5 px-2 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-800 font-bold text-[10px] text-center transition-colors inline-flex items-center justify-center gap-1">
                <svg class="w-3 h-3 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                <span>Destino</span>
            </button>
        </div>
    </div>

    <!-- Official SVG 2D Vector Map Canvas (1200 x 850) -->
    <svg id="officialCampus2dSvg" viewBox="0 0 1200 850" class="campus-svg-canvas">
        <defs>
            <!-- Clean Shadow Filter for Buildings -->
            <filter id="bldgShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.14" />
            </filter>
        </defs>

        <!-- ================================================================== -->
        <!-- 1. BASE CAMPUS GROUNDS & PERIMETER ROADS                           -->
        <!-- ================================================================== -->
        <!-- Background Ground -->
        <rect width="1200" height="850" fill="#e8ecf1" />

        <!-- Perimeter Access Drives (Lavender/Grey Roads) -->
        <g id="roadsLayer" fill="none" stroke="#c8cfde" stroke-linecap="round" stroke-linejoin="round">
            <!-- Top Road (Camino Segundo Acceso) -->
            <path d="M 60 70 L 1140 70" stroke-width="26" />
            <!-- West Entrance Road (Tercer Acceso) -->
            <path d="M 120 70 L 120 220 L 70 240 L 70 650" stroke-width="24" />
            <!-- South Entrance Main Access Road -->
            <path d="M 70 650 L 320 780 L 720 780 L 1140 780" stroke-width="26" />
            <!-- Internal Loop to Edificio P & O -->
            <path d="M 240 70 L 240 220 L 520 220 L 520 330" stroke-width="16" />
            <!-- Internal Loop to Sports Area & Edificio I -->
            <path d="M 520 220 L 880 220 L 880 720 L 520 720" stroke-width="18" />
            <!-- Road between C/B and E/F/G -->
            <path d="M 410 440 L 410 650 L 660 650" stroke-width="14" />
        </g>

        <!-- ================================================================== -->
        <!-- 2. PARKING AREAS & LANDSCAPING TREES                               -->
        <!-- ================================================================== -->
        <g id="parkingLayer">
            <!-- West Parking Bay -->
            <rect x="75" y="270" width="125" height="340" rx="8" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- South Main Parking -->
            <rect x="250" y="660" width="360" height="95" rx="8" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- North Parking (near Copernicus P) -->
            <rect x="270" y="90" width="150" height="40" rx="6" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />
            <text x="345" y="115" class="map-sublabel" text-anchor="middle">PARQUEO / PARKING LOT</text>
            <!-- North Parking (near Baseball Stadium) -->
            <rect x="580" y="90" width="130" height="40" rx="6" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />
            <text x="645" y="115" class="map-sublabel" text-anchor="middle">PARQUEO / PARKING LOT</text>

            <!-- Parking Row Stripes -->
            <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,6" opacity="0.6">
                <line x1="90" y1="320" x2="180" y2="320" />
                <line x1="90" y1="380" x2="180" y2="380" />
                <line x1="90" y1="440" x2="180" y2="440" />
                <line x1="90" y1="500" x2="180" y2="500" />
                <line x1="90" y1="560" x2="180" y2="560" />
                <line x1="280" y1="710" x2="580" y2="710" />
            </g>

            <!-- Circular Landscape Trees (Matching Official Signage Rows) -->
            <g id="treeCanopyLayer" fill="#475569" opacity="0.85">
                <!-- Row on West Parking -->
                <circle cx="85" cy="490" r="10"/><circle cx="110" cy="490" r="10"/><circle cx="135" cy="490" r="10"/><circle cx="160" cy="490" r="10"/><circle cx="185" cy="490" r="10"/>
                <circle cx="85" cy="570" r="10"/><circle cx="110" cy="570" r="10"/><circle cx="135" cy="570" r="10"/><circle cx="160" cy="570" r="10"/><circle cx="185" cy="570" r="10"/>
                <!-- Row on South Entrance -->
                <circle cx="280" cy="740" r="11"/><circle cx="310" cy="740" r="11"/><circle cx="340" cy="740" r="11"/><circle cx="370" cy="740" r="11"/><circle cx="400" cy="740" r="11"/><circle cx="430" cy="740" r="11"/><circle cx="460" cy="740" r="11"/><circle cx="490" cy="740" r="11"/>
                <!-- Trees near Sports & Baseball -->
                <circle cx="560" cy="220" r="12"/><circle cx="560" cy="255" r="12"/><circle cx="560" cy="290" r="12"/><circle cx="560" cy="325" r="12"/>
                <circle cx="560" cy="480" r="12"/><circle cx="560" cy="515" r="12"/><circle cx="560" cy="550" r="12"/>
            </g>
        </g>

        <!-- ================================================================== -->
        <!-- 3. SPORTS FACILITIES (BASEBALL, SOCCER, JAGUAR COMPLEX)           -->
        <!-- ================================================================== -->
        <g id="sportsComplexLayer">
            <!-- 3A. ESTADIO DE BÉISBOL / BASEBALL STADIUM -->
            <g id="baseballStadium" class="bldg-shape" data-node="sportsZone" data-bldg="BÉISBOL">
                <!-- Stadium Outer Boundary -->
                <rect x="610" y="145" width="235" height="185" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
                <!-- Outfield Grass (Solid Green Sector Arc) -->
                <path d="M 640 280 L 640 180 A 130 130 0 0 1 810 180 L 810 280 Z" fill="#22c55e" />
                <!-- Infield Dirt Diamond (Solid Clay Brown) -->
                <polygon points="725,185 765,225 725,265 685,225" fill="#c28854" stroke="#ffffff" stroke-width="2" />
                <!-- Infield Grass Center -->
                <polygon points="725,200 750,225 725,250 700,225" fill="#16a34a" />
                <!-- Pitcher's Mound -->
                <circle cx="725" cy="225" r="4" fill="#ffffff" />
                <!-- Bases: Home, 1st, 2nd, 3rd -->
                <rect x="723" y="262" width="5" height="5" fill="#ffffff" transform="rotate(45 725 264)" />
                <rect x="763" y="223" width="5" height="5" fill="#ffffff" transform="rotate(45 765 225)" />
                <rect x="723" y="183" width="5" height="5" fill="#ffffff" transform="rotate(45 725 185)" />
                <rect x="683" y="223" width="5" height="5" fill="#ffffff" transform="rotate(45 685 225)" />
                <!-- Stadium Label -->
                <text x="725" y="315" class="map-label" text-anchor="middle">ESTADIO DE BÉISBOL / BASEBALL STADIUM</text>
            </g>

            <!-- 3B. CANCHA DE FÚTBOL / SOCCER FIELD -->
            <g id="soccerField" class="bldg-shape" data-node="sportsZone" data-bldg="FÚTBOL">
                <!-- Pitch Outer Turf (Solid Pitch Green) -->
                <rect x="615" y="350" width="225" height="150" rx="8" fill="#15803d" stroke="#166534" stroke-width="2" />
                <!-- White Pitch Markings -->
                <g stroke="#ffffff" stroke-width="2" fill="none">
                    <!-- Touchlines / Goal lines -->
                    <rect x="625" y="360" width="205" height="130" />
                    <!-- Halfway Line -->
                    <line x1="727" y1="360" x2="727" y2="490" />
                    <!-- Center Circle -->
                    <circle cx="727" cy="425" r="24" />
                    <circle cx="727" cy="425" r="2" fill="#ffffff" />
                    <!-- Left Penalty Box & Goal -->
                    <rect x="625" y="390" width="32" height="70" />
                    <rect x="625" y="405" width="14" height="40" />
                    <!-- Right Penalty Box & Goal -->
                    <rect x="798" y="390" width="32" height="70" />
                    <rect x="816" y="405" width="14" height="40" />
                </g>
                <!-- Field Label -->
                <rect x="660" y="480" width="135" height="16" rx="4" fill="#0f172a" opacity="0.85" />
                <text x="727" y="492" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">CANCHA FÚTBOL / SOCCER FIELD</text>
            </g>

            <!-- 3C. JAGUAR SPORTS COMPLEX (CENTER, GYM, TENNIS COURTS) -->
            <g id="jaguarSportsComplex">
                <!-- Jaguar Center (Basketball Arena) - Solid Architectural Teal -->
                <g class="bldg-shape" data-node="jaguarCenter" data-bldg="JAGUAR CENTER">
                    <rect x="670" y="585" width="80" height="65" rx="6" fill="#0f766e" stroke="#042f2e" stroke-width="1.5" filter="url(#bldgShadow)" />
                    <!-- Roof Ridge -->
                    <rect x="676" y="591" width="68" height="53" rx="4" fill="#14b8a6" stroke="#0d9488" stroke-width="1" />
                    <!-- Basketball Court Lines -->
                    <rect x="684" y="599" width="52" height="37" rx="2" fill="#0f766e" stroke="#38bdf8" stroke-width="1.2" />
                    <circle cx="710" cy="617" r="7" fill="none" stroke="#38bdf8" stroke-width="1.2" />
                    <line x1="710" y1="599" x2="710" y2="636" stroke="#38bdf8" stroke-width="1.2" />
                    <text x="710" y="663" class="map-label" text-anchor="middle">JAGUAR CENTER</text>
                </g>

                <!-- Jaguar Gym - Solid Architectural Teal -->
                <g class="bldg-shape" data-node="jaguarCenter" data-bldg="JAGUAR GYM">
                    <rect x="765" y="640" width="65" height="50" rx="6" fill="#0f766e" stroke="#042f2e" stroke-width="1.5" filter="url(#bldgShadow)" />
                    <rect x="771" y="646" width="53" height="38" rx="4" fill="#14b8a6" />
                    <rect x="775" y="650" width="45" height="30" rx="3" fill="#0f766e" />
                    <text x="797" y="666" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">JAGUAR</text>
                    <text x="797" y="676" fill="#38bdf8" font-size="8.5" font-weight="bold" text-anchor="middle">GYM</text>
                </g>

                <!-- Multipurpose / Tennis / Volleyball Courts -->
                <g class="bldg-shape" data-node="buildingL" data-bldg="CANCHAS">
                    <rect x="765" y="555" width="75" height="55" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
                    <rect x="772" y="562" width="61" height="41" fill="none" stroke="#ffffff" stroke-width="1.5" />
                    <line x1="802" y1="555" x2="802" y2="610" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" />
                    <text x="802" y="622" class="map-sublabel" text-anchor="middle">CANCHAS / COURTS</text>
                </g>

                <!-- Grandstands (Graderías) -->
                <g>
                    <rect x="700" y="535" width="55" height="22" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" />
                    <text x="727" y="549" fill="#0f172a" font-size="8" font-weight="bold" text-anchor="middle">GRADERÍAS</text>
                </g>

                <!-- Building L Badge -->
                <rect x="825" y="540" width="18" height="18" rx="4" class="badge-cyan" />
                <text x="834" y="549" class="badge-text">L</text>
            </g>
        </g>

        <!-- ================================================================== -->
        <!-- 4. OFFICIAL CAMPUS BUILDINGS (A, B, C, D, E, F, G, H, I, J, K...)   -->
        <!-- Flat architectural styling, solid teal roofs, sharp facet ridges   -->
        <!-- ================================================================== -->
        <g id="buildingsLayer">

            <!-- 4P. EDIFICIO P (COPÉRNICO & OBSERVATORIO DOME) -->
            <g class="bldg-shape" data-node="buildingP" data-bldg="P">
                <!-- Copernicus Building Rect - Solid Flat Teal -->
                <rect x="260" y="145" width="195" height="50" rx="6" fill="#0f766e" stroke="#042f2e" stroke-width="1.5" filter="url(#bldgShadow)" />
                <rect x="268" y="151" width="179" height="38" rx="4" fill="#14b8a6" />
                <rect x="274" y="155" width="167" height="30" rx="3" fill="#0f766e" />

                <circle cx="250" cy="170" r="26" fill="#0284c7" stroke="#ffffff" stroke-width="3" filter="url(#bldgShadow)" />
                <circle cx="250" cy="170" r="14" fill="#0369a1" stroke="#ffffff" stroke-width="1.5" />
                <!-- Badge P (Maroon) -->
                <rect x="390" y="152" width="22" height="22" rx="5" class="badge-maroon" />
                <text x="401" y="163" class="badge-text">P</text>
                <!-- Labels -->
                <text x="325" y="174" fill="#ffffff" font-size="9" font-weight="bold">EDIFICIO COPÉRNICO</text>
                <text x="250" y="208" class="map-sublabel" text-anchor="middle">OBSERVATORIO</text>
            </g>

            <!-- 4O. EDIFICIO O (FACULTAD DE INGENIERÍA Y ARQUITECTURA - FIA) -->
            <g class="bldg-shape" data-node="buildingO" data-bldg="O">
                <!-- Angled multi-hipped building - Solid Flat Teal -->
                <polygon points="460,195 530,195 545,240 545,290 495,290 460,250" fill="#0f766e" stroke="#042f2e" stroke-width="1.5" filter="url(#bldgShadow)" />
                <polygon points="468,202 522,202 534,238 534,280 495,280 468,245" fill="#14b8a6" />
                <polygon points="474,208 514,208 524,236 524,272 495,272 474,242" fill="#0f766e" />
                <!-- Badge O (Amber) -->
                <rect x="480" y="225" width="22" height="22" rx="5" class="badge-amber" />
                <text x="491" y="236" class="badge-text">O</text>
                <text x="495" y="305" class="map-sublabel" text-anchor="middle">LAB. INGENIERÍA / CIAR</text>
            </g>

            <!-- Ranchón (Pavilion near O) -->
            <g class="bldg-shape" data-node="buildingO" data-bldg="RANCHON">
                <circle cx="455" cy="315" r="18" fill="#14b8a6" stroke="#0f766e" stroke-width="2.5" filter="url(#bldgShadow)" />
                <circle cx="455" cy="315" r="7" fill="#0f766e" />
                <text x="455" y="342" class="map-sublabel" text-anchor="middle">RANCHÓN</text>
            </g>

            <!-- 4N. EDIFICIO N (CLÍNICAS MÉDICAS ODONTOLÓGICAS) -->
            <g class="bldg-shape" data-node="buildingN" data-bldg="N">
                <!-- Large U-shaped Dental Clinics - Solid Flat Teal -->
                <path d="M 280 250 L 415 250 L 415 340 L 375 340 L 375 290 L 320 290 L 320 340 L 280 340 Z" fill="#0f766e" stroke="#042f2e" stroke-width="1.5" filter="url(#bldgShadow)" />
                <!-- Inner Roof Ridge -->
                <path d="M 288 258 L 407 258 L 407 332 L 383 332 L 383 282 L 312 282 L 312 332 L 288 332 Z" fill="#14b8a6" />
                <path d="M 294 264 L 401 264 L 401 326 L 389 326 L 389 276 L 306 276 L 306 326 L 294 326 Z" fill="#0f766e" />
                <!-- Badge N (Magenta) -->
                <rect x="300" y="260" width="22" height="22" rx="5" class="badge-magenta" />
                <text x="311" y="271" class="badge-text">N</text>
                <text x="355" y="272" fill="#ffffff" font-size="9" font-weight="bold">CLÍNICAS ODONTOLÓGICAS</text>
            </g>

            <!-- 4J. EDIFICIO J (LABORATORIOS DE ODONTOLOGÍA) -->
            <g class="bldg-shape" data-node="buildingJ" data-bldg="J">
                <rect x="280" y="355" width="45" height="35" rx="5" fill="#0f766e" stroke="#042f2e" stroke-width="1.5" filter="url(#bldgShadow)" />
                <rect x="285" y="360" width="35" height="25" rx="3" fill="#14b8a6" />
                <rect x="288" y="363" width="29" height="19" rx="2" fill="#0f766e" />
                <rect x="291" y="362" width="22" height="22" rx="5" class="badge-cyan" />
                <text x="302" y="373" class="badge-text">J</text>
            </g>

            <!-- 4D. EDIFICIO D (ODONTOLOGÍA DIGITAL CAM-CAM) -->
            <g class="bldg-shape" data-node="buildingD" data-bldg="D">
                <rect x="335" y="355" width="48" height="35" rx="5" fill="#0f766e" stroke="#042f2e" stroke-width="1.5" filter="url(#bldgShadow)" />
                <rect x="340" y="360" width="38" height="25" rx="3" fill="#14b8a6" />
                <rect x="344" y="363" width="30" height="19" rx="2" fill="#0f766e" />

                <circle cx="240" cy="375" r="12" fill="#10b981" opacity="0.6" />
                <text x="240" y="415" class="map-sublabel" text-anchor="middle">PLAZA CHILAMATES</text>
            </g>

            <!-- 4C. EDIFICIO C (AULAS C101-C310, CÓMPUTO & TESORERÍA) -->
            <g class="bldg-shape" data-node="buildingC" data-bldg="C">
                <!-- Long horizontal block parallel to B - Solid Flat Teal -->
                <rect x="280" y="410" width="250" height="36" rx="6" fill="#0f766e" stroke="#042f2e" stroke-width="1.5" filter="url(#bldgShadow)" />
                <rect x="288" y="416" width="234" height="24" rx="4" fill="#14b8a6" />
                <rect x="294" y="419" width="222" height="18" rx="3" fill="#0f766e" />
                <!-- Badge C (Navy) -->
                <rect x="365" y="417" width="22" height="22" rx="5" class="badge-navy" />
                <text x="376" y="428" class="badge-text">C</text>

                <circle cx="390" cy="459" r="4" fill="#10b981" />

            <!-- 4B. EDIFICIO B (AULAS B101-B210 & FARMACIA) -->

                <rect x="288" y="478" width="234" height="24" rx="4" fill="#14b8a6" />

                <rect x="365" y="479" width="22" height="22" rx="5" class="badge-purple" />
                <text x="376" y="490" class="badge-text">B</text>
