<!--
================================================================================
CAMPUS2DMAP COMPONENT (CAMPUS2DMAP.HTML)
================================================================================
Official UAM 2D Vector Campus Map:
- Direct high-fidelity official vector map image (100% exact to official reference)
- Interactive building overlays with hover & active states
- Animated Dijkstra route path and dynamic navigation pins
- Smooth pan & zoom controls and building detail popover
================================================================================
-->

<div class="campus-map-wrapper" id="campusMapWrapper">

    <!-- Map Toolbar (Zoom In, Zoom Out, Center View) -->
    <div class="absolute top-4 right-4 z-20 flex flex-col gap-1.5 bg-white/90 backdrop-blur-md p-1.5 rounded-xl border border-slate-200/90 shadow-md">
        <button id="btnMapZoomIn" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm transition-all active:scale-95 shadow-2xs" title="Acercar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
        <button id="btnMapZoomOut" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm transition-all active:scale-95 shadow-2xs" title="Alejar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
        </button>
        <button id="btnMapResetView" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center text-xs transition-all active:scale-95 shadow-2xs" title="Centrar Mapa">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"></circle><circle cx="12" cy="12" r="3" stroke-width="2"></circle><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3m10-10h-3M5 12H2"></path></svg>
        </button>
    </div>

    <!-- Active Building Popover -->
    <div id="bldgPopover" class="absolute z-30 bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-200/90 p-4 max-w-xs text-xs text-slate-800 hidden transition-all pointer-events-auto popover-animated">
        <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex items-center gap-2.5">
                <span id="popoverBadge" class="w-7 h-7 rounded-lg flex items-center justify-center text-white font-extrabold text-xs shadow-xs"></span>
                <span id="popoverName" class="font-bold text-slate-900 text-sm leading-tight"></span>
            </div>
            <button id="btnCloseBldgPopover" type="button" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="popoverFacilities" class="text-slate-600 text-[11px] space-y-1 mb-3 max-h-32 overflow-y-auto pr-1"></div>
        <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <button id="btnSetBldgOrigin" type="button" class="flex-1 py-1.5 px-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-[11px] text-center transition-colors inline-flex items-center justify-center gap-1 shadow-2xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                <span>Origen</span>
            </button>
            <button id="btnSetBldgDestination" type="button" class="flex-1 py-1.5 px-2 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-800 font-bold text-[11px] text-center transition-colors inline-flex items-center justify-center gap-1 shadow-2xs">
                <svg class="w-3.5 h-3.5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                <span>Destino</span>
            </button>
        </div>
    </div>

    <!-- Official SVG 2D Vector Map Canvas (1024 x 764) -->
    <svg id="officialCampus2dSvg" viewBox="0 0 1024 764" class="campus-svg-canvas">
        <defs>
            <filter id="bldgShadow" x="-10%" y="-10%" width="125%" height="125%">
                <feDropShadow dx="2" dy="3.5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
            </filter>
            <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="1" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
            </filter>
            <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- ================================================================== -->
        <!-- 1. OFFICIAL DIGITAL VECTOR UAM MAP IMAGE (100% IDENTICAL)          -->
        <!-- ================================================================== -->
        <image href="{{ url_for('static', filename='img/officialMap.jpg') }}" x="0" y="0" width="1024" height="764" preserveAspectRatio="none" />

        <!-- ================================================================== -->
        <!-- 2. INTERACTIVE BUILDING HITBOXES & SELECTION OVERLAYS              -->
        <!-- ================================================================== -->
        <g id="interactiveBuildingsLayer">
            <!-- Edificio P (Copérnico) -->
            <rect x="250" y="65" width="235" height="72" rx="8" class="bldg-shape" data-node="buildingP" data-bldg="P" />
            
            <!-- Edificio O (FIA) -->
            <polygon points="475,145 545,145 545,260 475,260" class="bldg-shape" data-node="buildingO" data-bldg="O" />
            
            <!-- Edificio N (Clínicas Odontológicas) -->
            <path d="M 300 240 L 440 240 L 440 375 L 390 375 L 390 295 L 345 295 L 345 375 L 300 375 Z" class="bldg-shape" data-node="buildingN" data-bldg="N" />
            
            <!-- Edificio J (Labs Odontología) -->
            <rect x="275" y="335" width="42" height="40" rx="6" class="bldg-shape" data-node="buildingJ" data-bldg="J" />
            
            <!-- Edificio D (Odontología Digital) -->
            <rect x="320" y="335" width="42" height="40" rx="6" class="bldg-shape" data-node="buildingD" data-bldg="D" />
            
            <!-- Plaza Chilamates -->
            <rect x="210" y="335" width="55" height="50" rx="8" class="bldg-shape" data-node="chilamatesPlaza" data-bldg="CHILAMATES" />
            
            <!-- Edificio C (Cómputo / Aulas C) -->
            <rect x="275" y="445" width="205" height="35" rx="6" class="bldg-shape" data-node="buildingC" data-bldg="C" />
            
            <!-- Edificio B (Aulas B / Farmacia) -->
            <rect x="275" y="490" width="205" height="35" rx="6" class="bldg-shape" data-node="buildingB" data-bldg="B" />
            
            <!-- Edificio A (CAE / Atención al Estudiante) -->
            <rect x="250" y="445" width="35" height="80" rx="6" class="bldg-shape" data-node="buildingA" data-bldg="A" />
            
            <!-- Edificio H (Laboratorios Medicina) -->
            <polygon points="485,385 590,385 590,435 545,435 545,530 485,530" class="bldg-shape" data-node="buildingH" data-bldg="H" />
            
            <!-- Edificio K (Cafetería Central & Terrazas) -->
            <polygon points="275,575 320,575 335,615 320,650 275,650" class="bldg-shape" data-node="buildingK" data-bldg="K" />
            
            <!-- Edificio E (Facultad de Medicina) -->
            <rect x="435" y="555" width="30" height="225" rx="6" class="bldg-shape" data-node="buildingE" data-bldg="E" />
            
            <!-- Edificio G (Derecho & Auditorio) -->
            <rect x="475" y="555" width="55" height="55" rx="6" class="bldg-shape" data-node="buildingG" data-bldg="G" />
            
            <!-- Edificio F (FACEE) -->
            <rect x="475" y="620" width="55" height="70" rx="6" class="bldg-shape" data-node="buildingF" data-bldg="F" />
            
            <!-- Edificio I (Rectoría & Biblioteca Central) -->
            <path d="M 605 525 L 675 525 L 675 650 L 610 650 L 610 575 L 630 575 L 630 545 L 605 545 Z" class="bldg-shape" data-node="buildingI" data-bldg="I" />
            
            <!-- Sports Complex (Estadio de Béisbol & Cancha de Fútbol) -->
            <rect x="575" y="75" width="320" height="400" rx="14" class="bldg-shape" data-node="sportsZone" data-bldg="DEPORTES" />
            
            <!-- Jaguar Center -->
            <rect x="695" y="505" width="90" height="100" rx="8" class="bldg-shape" data-node="jaguarCenter" data-bldg="JAGUAR CENTER" />
            
            <!-- Edificio L & Canchas -->
            <rect x="805" y="485" width="85" height="65" rx="6" class="bldg-shape" data-node="buildingL" data-bldg="L" />
            
            <!-- Parqueo Sur & Entrada Principal -->
            <rect x="260" y="560" width="165" height="110" rx="8" class="bldg-shape" data-node="mainParking" data-bldg="PARQUEO" />
        </g>

        <!-- ================================================================== -->
        <!-- 3. DIJKSTRA ANIMATED ROUTE OVERLAY                                 -->
        <!-- ================================================================== -->
        <g id="route2dLayer">
            <!-- Glow background line -->
            <polyline id="route2dGlowPolyline" points="" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" filter="url(#glowEffect)" class="route-glow-pulse" />
            <!-- Main dashed animated walking polyline -->
            <polyline id="route2dPolyline" points="" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ruta-animada" />
        </g>

        <!-- Origin (Green) & Destination (Red Flag) Pin Markers -->
        <g id="route2dPinsLayer">
            <g id="origin2dPin" class="hidden"></g>
            <g id="destination2dPin" class="hidden"></g>
        </g>

    </svg>

</div>
