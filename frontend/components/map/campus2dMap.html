<!--
================================================================================
CAMPUS2DMAP COMPONENT (CAMPUS2DMAP.HTML)
================================================================================
Official UAM 2D Vector Campus Map faithfully replicating the official signage:
- Flat architectural building layouts (A, B, C, D, E, F, G, H, I, J, K, L, M, N, O, P)
- Real sports facilities: Baseball Stadium, Soccer Field, Jaguar Center, Jaguar Gym, Courts
- Plaza Central Rubén Darío, Plaza Chilamates, Ranchón, Weather Station, Parking & Tree rows
- Pedestrian walkway network and animated Dijkstra route path
- Official letter badges and orientation compass rose
- Clean flat architectural colors (pure 2D vector view)
================================================================================
-->

<!-- 2.5D PERSPECTIVE VIEWPORT (CAMERA PERSPECTIVE & HORIZON ATMOSPHERE) -->
<div class="campus-25d-viewport" id="campus25dViewport">

    <!-- Atmosphere Horizon Gradient (Visible in 2.5D Mode) -->
    <div id="campusHorizonAtmosphere" class="campus-horizon-atmosphere pointer-events-none"></div>

    <!-- 2.5D Perspective Controls & Turn-by-Turn HUD -->
    {% include "components/map/campus25dMap.html" %}

    <!-- Map Toolbar (Zoom, Center, 2.5D Perspective Toggle) -->
    <div class="absolute top-4 right-4 z-20 flex flex-col gap-1.5 bg-white/90 backdrop-blur-md p-1.5 rounded-xl border border-slate-200/90 shadow-md">
        <button id="btnMapZoomIn" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm transition-colors" title="Acercar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
        <button id="btnMapZoomOut" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm transition-colors" title="Alejar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
        </button>
        <button id="btnMapResetView" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center text-xs transition-colors" title="Centrar Mapa">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"></circle><circle cx="12" cy="12" r="3" stroke-width="2"></circle><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3m10-10h-3M5 12H2"></path></svg>
        </button>
        <button id="btnToggle25dQuick" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-brand-50 hover:text-brand-600 text-slate-700 flex items-center justify-center font-black text-[11px] transition-colors" title="Alternar Vista 2.5D Perspectiva">
            3D
        </button>
    </div>

    <!-- Active Building Popover -->
    <div id="bldgPopover" class="absolute z-30 bg-white rounded-xl shadow-2xl border border-slate-200 p-4 max-w-xs text-xs text-slate-800 hidden transition-all pointer-events-auto">
        <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
                <span id="popoverBadge" class="w-6 h-6 rounded-md flex items-center justify-center text-white font-extrabold text-xs"></span>
                <span id="popoverName" class="font-bold text-slate-900 text-sm leading-tight"></span>
            </div>
            <button id="btnCloseBldgPopover" type="button" class="text-slate-400 hover:text-slate-600">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="popoverFacilities" class="text-slate-600 text-[11px] space-y-1 mb-3 max-h-32 overflow-y-auto pr-1"></div>
        <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <button id="btnSetBldgOrigin" type="button" class="flex-1 py-1.5 px-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-[10px] text-center transition-colors inline-flex items-center justify-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                <span>Origen</span>
            </button>
            <button id="btnSetBldgDestination" type="button" class="flex-1 py-1.5 px-2 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-800 font-bold text-[10px] text-center transition-colors inline-flex items-center justify-center gap-1">
                <svg class="w-3 h-3 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                <span>Destino</span>
            </button>
        </div>
    </div>

    <!-- Official Campus Orientation Compass (Bottom-Left Viewport Overlay) -->
    {% include "components/map/compass.html" %}

                <rect x="705" y="575" width="60" height="45" />
            </clipPath>
        </defs>

        <!-- Seamless Ground Base (covers background infinitely during 3D perspective tilt & 360 rotation) -->
        <rect x="-30000" y="-30000" width="60000" height="60000" fill="#f3f5f8" />

        <!-- Master Vector Camera Group: vector pan, scale(2.2), and bearing rotation calculated mathematically -->
        <g id="mapCameraGroup">

        <!-- ================================================================== -->
        <!-- 1. BASE CAMPUS GROUNDS & PERIMETER ROADS                           -->
        <!-- ================================================================== -->
        <!-- Background Ground (Bleeds infinitely within camera space) -->
        <rect x="-30000" y="-30000" width="60000" height="60000" fill="#f3f5f8" />

        <!-- Perimeter Access Drives (Lavender/Grey Roads) -->
        <g id="roadsLayer" fill="none" stroke="#c8cfde" stroke-linecap="round" stroke-linejoin="round">
            <!-- Top Road (Camino Segundo Acceso) - Extends into horizon -->
            <path d="M -8000 70 L 8000 70" stroke-width="26" />
            <!-- West Entrance Road (Tercer Acceso) - Extends north & south -->
            <path d="M 120 -6000 L 120 220 L 70 240 L 70 6000" stroke-width="24" />
            <!-- South Entrance Main Access Road - Extends east & west -->
            <path d="M -8000 780 L 720 780 L 8000 780" stroke-width="26" />
            <!-- Internal Loop to Edificio P & O -->
            <path d="M 240 70 L 240 220 L 520 220 L 520 330" stroke-width="16" />

            <path d="M 520 220 L 880 220 L 880 720 L 520 720" stroke-width="18" />
            <!-- Road between C/B and E/F/G -->

            <path d="M 120 355 L 260 355" stroke-width="16" />

        <!-- ================================================================== -->

        <!-- ================================================================== -->

            <rect x="75" y="270" width="125" height="340" rx="8" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />

            <rect x="270" y="90" width="150" height="40" rx="6" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- North Parking (near Baseball Stadium) -->
            <rect x="580" y="90" width="130" height="40" rx="6" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />

            <!-- Central Parking Lot (Between Building C and Buildings J & D / N) -->

                <path d="M 258 355 L 278 322 L 512 322 L 512 388 L 258 388 Z" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />

                <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
                    <line x1="280" y1="368" x2="280" y2="384" />
                    <line x1="292" y1="368" x2="292" y2="384" />
                    <line x1="304" y1="368" x2="304" y2="384" />
                    <line x1="316" y1="368" x2="316" y2="384" />
                    <line x1="328" y1="368" x2="328" y2="384" />
                    <line x1="340" y1="368" x2="340" y2="384" />
                    <line x1="352" y1="368" x2="352" y2="384" />
                    <line x1="364" y1="368" x2="364" y2="384" />
                    <line x1="376" y1="368" x2="376" y2="384" />
                    <line x1="388" y1="368" x2="388" y2="384" />
                    <line x1="400" y1="368" x2="400" y2="384" />
                    <line x1="412" y1="368" x2="412" y2="384" />
                    <line x1="424" y1="368" x2="424" y2="384" />
                    <line x1="436" y1="368" x2="436" y2="384" />
                    <line x1="448" y1="368" x2="448" y2="384" />
                    <line x1="460" y1="368" x2="460" y2="384" />
                    <line x1="472" y1="368" x2="472" y2="384" />

                    <circle cx="517" cy="380" r="4.5" />
                </g>
            </g>

            <!-- Pedestrian Path & Crosswalk Between Plaza Chilamates and Building A -->
            <g id="pedestrianChilamatesToA">
                <rect x="238" y="315" width="24" height="75" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.2" />

                <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="butt">

            </g>

            <!-- Circular Landscape Trees (Matching Official Signage Rows) -->
            <g id="treeCanopyLayer" fill="#475569" opacity="0.85">
                <!-- Row on West Parking -->

                <circle cx="85" cy="570" r="10"/><circle cx="110" cy="570" r="10"/><circle cx="135" cy="570" r="10"/><circle cx="160" cy="570" r="10"/><circle cx="185" cy="570" r="10"/>
                <!-- Row on South Entrance -->
                <circle cx="280" cy="740" r="11"/><circle cx="310" cy="740" r="11"/><circle cx="340" cy="740" r="11"/><circle cx="370" cy="740" r="11"/><circle cx="400" cy="740" r="11"/><circle cx="430" cy="740" r="11"/><circle cx="460" cy="740" r="11"/><circle cx="490" cy="740" r="11"/>

                <!-- Trees west of Edificio K (matching official signage & western boundary guide) -->
                <circle cx="215" cy="450" r="8.5"/><circle cx="215" cy="480" r="8.5"/><circle cx="215" cy="510" r="8.5"/>
                <circle cx="215" cy="540" r="8.5"/><circle cx="215" cy="570" r="8.5"/><circle cx="215" cy="600" r="8.5"/>

        <!-- ================================================================== -->
        <!-- 3. SPORTS FACILITIES (BASEBALL, SOCCER, JAGUAR COMPLEX)           -->
        <!-- ================================================================== -->
        <g id="sportsComplexLayer">
            <!-- 3A. ESTADIO DE BÉISBOL / BASEBALL STADIUM -->
            <g id="baseballStadium" class="bldg-shape" data-node="sportsZone" data-bldg="BÉISBOL">
                <!-- Stadium Outer Boundary -->
                <rect x="640" y="80" width="230" height="175" fill="#f1f5f9" stroke="#253452" stroke-width="2" />
                <!-- Outfield Grass (Solid Green Sector Arc) -->
                <path d="M 665 210 L 665 115 A 120 120 0 0 1 825 115 L 825 210 Z" fill="#22c55e" />
                <!-- Infield Dirt Diamond (Solid Clay Brown) -->
                <polygon points="745,120 780,155 745,190 710,155" fill="#c28854" stroke="#ffffff" stroke-width="2" />
                <!-- Infield Grass Center -->
                <polygon points="745,133 768,155 745,177 722,155" fill="#16a34a" />
                <!-- Pitcher's Mound -->
                <circle cx="745" cy="155" r="3.5" fill="#ffffff" />
                <!-- Bases: Home, 1st, 2nd, 3rd -->
                <rect x="743" y="188" width="4.5" height="4.5" fill="#ffffff" transform="rotate(45 745 190)" />
                <rect x="778" y="153" width="4.5" height="4.5" fill="#ffffff" transform="rotate(45 780 155)" />
                <rect x="743" y="118" width="4.5" height="4.5" fill="#ffffff" transform="rotate(45 745 120)" />

            <g id="soccerField" class="bldg-shape" data-node="sportsZone" data-bldg="FÚTBOL">
                <!-- Pitch Outer Turf (Solid Pitch Green) -->
                <rect x="640" y="280" width="245" height="155" fill="#15803d" stroke="#253452" stroke-width="2.5" />
                <!-- White Pitch Markings -->
                <g stroke="#ffffff" stroke-width="2" fill="none">
                    <!-- Touchlines / Goal lines -->
                    <rect x="650" y="290" width="225" height="135" />
                    <!-- Halfway Line -->
                    <line x1="762" y1="290" x2="762" y2="425" />
                    <!-- Center Circle -->
                    <circle cx="762" cy="357" r="24" />
                    <circle cx="762" cy="357" r="2" fill="#ffffff" />
                    <!-- Left Penalty Box & Goal -->
                    <rect x="650" y="322" width="34" height="70" />
                    <rect x="650" y="337" width="15" height="40" />
                    <!-- Right Penalty Box & Goal -->
                    <rect x="841" y="322" width="34" height="70" />
                    <rect x="860" y="337" width="15" height="40" />

            </g>

            <!-- 3C. JAGUAR SPORTS COMPLEX (CENTER, GYM, TENNIS COURTS) -->

                <!-- Jaguar Center (Arena) -->
                <g class="bldg-shape" data-node="jaguarCenter" data-bldg="JAGUAR CENTER" filter="url(#bldgShadow)">
                    <g clip-path="url(#clipJaguarCenter)">
                        <!-- Base: #1da495 -->
                        <rect x="690" y="465" width="90" height="90" fill="#1da495" />
                        <!-- Lightning top slope: #48b2a9 -->
                        <polygon points="690,465 780,465 780,510 690,510" fill="#48b2a9" />
                        <!-- Shadow Left Triangle: #1f8383 -->
                        <polygon points="690,465 690,555 720,510" fill="#1f8383" />
                        <!-- Shadow Right Triangle: #1f8383 -->
                        <polygon points="780,465 780,555 750,510" fill="#1f8383" />
                    </g>
                    <!-- Navy Border: #253452, Sharp Corners -->
                    <rect x="690" y="465" width="90" height="90" fill="none" stroke="#253452" stroke-width="3.5" stroke-linejoin="miter" />
                </g>

                <!-- Jaguar Gym -->
                <g class="bldg-shape" data-node="jaguarCenter" data-bldg="JAGUAR GYM" filter="url(#bldgShadow)">
                    <g clip-path="url(#clipJaguarGym)">
                        <!-- Base: #1da495 -->
                        <rect x="705" y="575" width="60" height="45" fill="#1da495" />
                        <!-- Lightning top slope: #48b2a9 -->
