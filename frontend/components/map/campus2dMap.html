<!--
================================================================================
CAMPUS2DMAP COMPONENT (CAMPUS2DMAP.HTML)
================================================================================
Official UAM 2D Vector Campus Map faithfully replicating the physical campus map:
- Clean layered SVG canvas (1200 x 850) populated declaratively by campusMapRenderer.js
- Architectural buildings (A-P + Observatorio, Ranchon, sports & east complex)
- Detailed parking bays, landscaping trees/bushes, plazas & sports fields
- Dedicated toggleable Emergency Evacuation Layer (safe points & green routes)
- Animated Dijkstra route path & 2.5D perspective overlay compatibility
================================================================================
-->

<!-- 2.5D PERSPECTIVE VIEWPORT (CAMERA PERSPECTIVE & HORIZON ATMOSPHERE) -->
<div class="campus-25d-viewport" id="campus25dViewport">

    <!-- Atmosphere Horizon Gradient (Visible in 2.5D Mode) -->
    <div id="campusHorizonAtmosphere" class="campus-horizon-atmosphere pointer-events-none"></div>

    <!-- 2.5D Perspective Controls & Turn-by-Turn HUD -->
    {% include "components/map/campus25dMap.html" %}

    <!-- Right-Edge Waze Control Stack (Compact Map Controls + Circular Compass) -->
    <div id="mapRightToolbar" class="waze-right-stack absolute top-3 right-3 sm:top-4 sm:right-4 z-20 flex flex-col items-center gap-2.5 transition-all duration-300 pointer-events-none">
        <div class="flex flex-col gap-1 bg-white/95 backdrop-blur-md p-1 rounded-2xl border border-slate-200/90 shadow-lg shadow-slate-900/10 pointer-events-auto">
            <button id="btnMapZoomIn" type="button" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-800 flex items-center justify-center font-bold text-sm transition-colors cursor-pointer" title="Acercar">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"></path></svg>
            </button>
            <button id="btnMapZoomOut" type="button" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-800 flex items-center justify-center font-bold text-sm transition-colors cursor-pointer" title="Alejar">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M20 12H4"></path></svg>
            </button>
            <button id="btnMapResetView" type="button" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-800 flex items-center justify-center text-xs transition-colors cursor-pointer" title="Centrar Mapa">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"></circle><circle cx="12" cy="12" r="2.8" stroke-width="2"></circle><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3m10-10h-3M5 12H2"></path></svg>
            </button>
            <button id="btnToggle25dQuick" type="button" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-sky-50 hover:text-sky-600 text-slate-700 flex items-center justify-center font-black text-[11px] transition-colors cursor-pointer" title="Alternar Vista 2.5D Perspectiva">
                3D
            </button>
            <button id="btnToggleEmergencyLayer" type="button" aria-pressed="true" class="w-9 h-9 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-800 flex items-center justify-center transition-colors cursor-pointer" title="Puntos de Encuentro y Rutas de Evacuación">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </button>
            <!-- Lost & Found Waze Alert Layer Toggle -->
            <button id="btnToggleLostObjectsLayer" type="button" aria-pressed="true" class="relative w-9 h-9 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-800 flex items-center justify-center transition-colors cursor-pointer" title="Capa de Objetos Perdidos (Alertas Waze)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                <span id="mapLostPinsBadgeCount" class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-600 text-white text-[9px] font-black flex items-center justify-center shadow-xs hidden">0</span>
            </button>
            <button id="btnToggleWalkwaysLayer"  type="button" aria-pressed="true" class="w-9 h-9 rounded-xl bg-pink-100 hover:bg-pink-200 text-pink-700 flex items-center justify-center transition-colors cursor-pointer" title="Mostrar / Ocultar Red Peatonal Micro (Pasillos, Puentes y Muros)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="4.5" r="2" stroke-width="2.1"></circle>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" d="M9.5 10.5l2.5 1.8 3-1.3M12 12.3V16l-2.8 4.5M12 16l3.2 4.2M7.5 13.5l2-3"></path>
                </svg>
            </button>
        </div>

        <!-- Circular Waze Compass (Floats right below the toolbar on the right edge) -->
        {% include "components/map/compass.html" %}
    </div>

    <!-- Compact Light-Theme Micro-Walkways Legend Pill (Visible on Desktop when Walkways Layer is ON) -->
    <div id="walkwaysLegendPill" class="hidden lg:flex items-center gap-2.5 absolute top-[62px] left-4 z-20 bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-full border border-pink-200/90 shadow-md shadow-pink-900/8 text-[10.5px] font-bold text-slate-700 pointer-events-none select-none">
        <span class="inline-flex items-center gap-1"><span class="w-3.5 h-0.5 rounded-full bg-pink-500 inline-block"></span>Peatonal P1</span>
        <span class="inline-flex items-center gap-1"><span class="w-3.5 h-0.5 rounded-full border-t-2 border-dashed border-violet-600 inline-block"></span>Puente 2P</span>
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-sky-500 inline-block"></span>Puerta</span>
        <span class="inline-flex items-center gap-1 text-rose-600"><span class="font-black leading-none">&times;</span>Bloqueado</span>
    </div>

    
    <!-- Waze-style Lost & Found Pin Detail Popover -->
    <div id="lostFoundPinPopover" class="absolute z-30 bg-white rounded-3xl shadow-2xl border border-slate-200 p-4 w-[calc(100%-24px)] max-w-sm text-xs text-slate-800 hidden transition-all pointer-events-auto">
        <div class="flex items-start justify-between gap-2 mb-2 pb-2 border-b border-slate-100">
            <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-sm font-bold">
                    <svg class="w-4 h-4 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                </span>
                <div>
                    <span id="lostPinNodeName" class="font-extrabold text-slate-900 text-sm block leading-tight"></span>
                    <span id="lostPinCountSubtitle" class="text-[10px] text-slate-400 font-semibold"></span>
                </div>
            </div>
            <button id="btnCloseLostPinPopover" type="button" class="text-slate-400 hover:text-slate-600 cursor-pointer p-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="lostPinItemsList" class="space-y-2 mb-3 max-h-48 overflow-y-auto pr-1"></div>
        <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <a id="btnViewInCatalog" href="/lost-found-object/catalogo" class="flex-1 py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-[11px] text-center transition">
                Ver en Catálogo
            </a>
            <button id="btnReportHere" type="button" class="flex-1 py-2 px-3 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-bold text-[11px] text-center transition shadow-xs">
                + Reportar Aquí
            </button>
        </div>
    </div>

    <!-- Active Building Popover -->
    <div id="bldgPopover" class="absolute z-30 bg-white rounded-2xl shadow-2xl border border-slate-200 p-4 w-[calc(100%-24px)] max-w-xs text-xs text-slate-800 hidden transition-all pointer-events-auto">
        <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
                <span id="popoverBadge" class="w-6 h-6 rounded-md flex items-center justify-center text-white font-extrabold text-xs"></span>
                <span id="popoverName" class="font-bold text-slate-900 text-sm leading-tight"></span>
            </div>
            <button id="btnCloseBldgPopover" type="button" class="text-slate-400 hover:text-slate-600 cursor-pointer">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="popoverFacilities" class="text-slate-600 text-[11px] space-y-1 mb-3 max-h-32 overflow-y-auto pr-1"></div>
        <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <button id="btnSetBldgOrigin" type="button" class="flex-1 py-2 px-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-[11px] text-center transition-colors inline-flex items-center justify-center gap-1 cursor-pointer">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                <span>Origen</span>
            </button>
            <button id="btnSetBldgDestination" type="button" class="flex-1 py-2 px-2 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold text-[11px] text-center transition-colors inline-flex items-center justify-center gap-1 cursor-pointer">
                <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                <span>Ir aquí</span>
            </button>
        </div>
    </div>

    <!-- 3D Transformable Stage (CSS 3D perspective plane with lower-third anchor) -->
    <div class="campus-map-wrapper campus-3d-stage" id="campusMapWrapper">

        <!-- Official SVG 2D Vector Map Canvas (1200 x 850) -->
        <svg id="officialCampus2dSvg"
             viewBox="0 0 1200 850"
             data-jaguar-logo="{{ url_for('static', filename='img/jaguarCenterLogo.png') }}"
             class="campus-svg-canvas"
             overflow="visible"
             shape-rendering="geometricPrecision"
             text-rendering="geometricPrecision">
            <defs>
                <!-- Clean Elevation Shadow Filter for Buildings -->
                <filter id="bldgShadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="1.8" dy="3.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.18" />
                </filter>

                <!-- Diagonal Hatching Pattern for Plaza Central Terrace -->
                <pattern id="plazaDiagonalHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" opacity="0.65" />
                </pattern>

                <!-- Reusable Landscaping Tree Symbol (Compact so campus details stay crisp) -->
                <g id="treeLarge">
                    <circle cx="0.8" cy="1.2" r="5" fill="#0f172a" opacity="0.14" />
                    <circle cx="0" cy="0" r="5" fill="#3b5e54" stroke="#28423b" stroke-width="0.8" />
                    <circle cx="-1.4" cy="-1.4" r="2.1" fill="#527d70" opacity="0.7" />
                </g>

                <!-- Reusable Manicured Bush / Hedge Symbol -->
                <g id="treeSmall">
                    <circle cx="0.4" cy="0.6" r="2.2" fill="#0f172a" opacity="0.12" />
                    <circle cx="0" cy="0" r="2.2" fill="#476e63" stroke="#2f4d44" stroke-width="0.55" />
                    <circle cx="-0.6" cy="-0.6" r="0.9" fill="#639284" opacity="0.75" />
                </g>

                <!-- Emergency Evacuation Arrowhead Marker -->
                <marker id="evacArrow" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
                    <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#15803d" />
                </marker>
            </defs>

            <!-- Seamless Ground Base (covers infinite horizon during 2.5D perspective tilt & rotation) -->
            <rect x="-30000" y="-30000" width="60000" height="60000" fill="#f3f5f8" />

            <!-- Master Vector Camera Group -->
            <g id="mapCameraGroup">
                <rect x="-30000" y="-30000" width="60000" height="60000" fill="#f3f5f8" />

                <!-- 1. Campus Roads & Perimeter Access Drives -->
                <g id="roadsLayer" fill="none" stroke="#c8cfde" stroke-linecap="round" stroke-linejoin="round"></g>

                <!-- 2. Campus Parking Lots (11 Lots with Procedurally Generated Stalls) -->
                <g id="parkingLayer"></g>

                <!-- 3. Sports Facilities (Baseball Stadium, Soccer Field, Courts, Grandstands) -->
                <g id="sportsComplexLayer"></g>

                <!-- 4. Plazas & Courtyards (Plaza Central, Plaza Chilamates, B-C Courtyard) -->
                <g id="plazasLayer"></g>

                <!-- 5. Campus Buildings (A-P + Observatorio, Kiosks, Sports & East Complex) -->
                <g id="buildingsLayer"></g>

                <!-- 6. Landscaping Trees & Bushes -->
                <g id="landscapingLayer" pointer-events="none"></g>

                <!-- 7. Emergency Layer: Safe Areas, Meeting Points & Evacuation Routes -->
                <g id="emergencyEvacuationLayer" pointer-events="none"></g>

                <!-- 7B. Toggleable Micro-Level Pedestrian Walkways Layer (Sidewalks, Doors, 2F Bridges & Wall Barriers) -->
                <g id="pedestrianWalkwaysLayer" pointer-events="none"></g>

                <!-- 8. JaguarFind Blue & Light-Blue Navigation Route Overlay -->
                <g id="route2dLayer">
                    <polyline id="route2dShadowPolyline" points="" fill="none" stroke="#0284c7" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" />
                    <polyline id="route2dGlowPolyline" points="" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
                    <polyline id="route2dPolyline" points="" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ruta-animada" />
                </g>

                <!-- 9. Origin & Destination Pin Markers -->
                <!-- 10. Waze-style Lost & Found Alert Pins Layer -->
                <g id="lostFoundMapPinsLayer"></g>

                <g id="route2dPinsLayer">
                    <g id="origin2dPin" class="hidden"></g>
                    <g id="destination2dPin" class="hidden"></g>
                </g>
            </g>
        </svg>

    </div>

    <!-- Decoupled 2.5D HTML Overlay Layer (Un-tilted UI: Blue/Light-Blue 3D User Arrow Puck, Light Location Pill, Badges, Pins) -->
    <div id="campus25dOverlayLayer" class="campus-25d-overlay-layer absolute inset-0 pointer-events-none z-20 overflow-hidden hidden">
        <div id="wazeNavigationPuck" class="waze-puck-container pointer-events-none">
            <div class="waze-puck-halo"></div>
            <div class="waze-puck-pulse"></div>
            <div id="wazePuckCone" class="waze-puck-cone"></div>
            <div id="wazePuckArrow" class="waze-puck-arrow">
                <!-- Glossy JaguarFind 3D Light-Blue & Ocean-Blue User Navigation Chevron -->
                <svg class="w-full h-full" viewBox="0 0 56 56" fill="none">
                    <!-- 3D ocean-blue base extrusion -->
                    <path d="M 28 11 L 46 39 C 47.4 41.2 45.4 44 42.8 43 L 28 37.5 L 13.2 43 C 10.6 44 8.6 41.2 10 39 Z" fill="#0284c7" />
                    <!-- Luminous light-blue top chevron face with crisp white rim -->
                    <path d="M 28 8 L 45.5 35.5 C 46.8 37.6 44.8 40.2 42.4 39.2 L 28 33.8 L 13.6 39.2 C 11.2 40.2 9.2 37.6 10.5 35.5 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" />
                    <!-- Subtle airy specular left highlight + ocean-blue directional core dot -->
                    <path d="M 28 11 L 14.5 34.5 L 28 30.8 Z" fill="#bae6fd" opacity="0.78" />
                    <circle cx="28" cy="27" r="3.2" fill="#0369a1" stroke="#ffffff" stroke-width="1.2" />
                </svg>
            </div>
            <!-- JaguarFind Light-Themed White & Sky-Blue Active Location Pill Badge -->
            <div id="wazeActiveRoadPill" class="waze-road-pill hidden">Campus UAM</div>
        </div>
        <div id="wazeBadgesContainer" class="absolute inset-0 pointer-events-none"></div>
        <div id="wazeOriginPin" class="waze-pin-origin hidden pointer-events-none"></div>
        <div id="wazeDestPin" class="waze-pin-dest hidden pointer-events-none"></div>
    </div>

</div>
