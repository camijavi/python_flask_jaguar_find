<!--
================================================================================
CAMPUS2DMAP COMPONENT (CAMPUS2DMAP.HTML)
================================================================================
Official UAM 2D Vector Campus Map faithfully replicating the official signage:
- Flat architectural building layouts (A, B, C, D, E, F, G, H, I, J, K, L, M, N, O, P)
- Real sports facilities: Baseball Stadium, Soccer Field, Jaguar Center, Jaguar Gym, Courts
- Plaza Central Rubén Darío, Plaza Chilamates, Ranchón, Weather Station, Parking & Tree rows
- Pedestrian walkway network and animated Dijkstra route path
- Official letter badges and orientation compass rose
- Clean flat architectural colors (pure 2D vector view)
================================================================================
-->

<!-- 2.5D PERSPECTIVE VIEWPORT (CAMERA PERSPECTIVE & HORIZON ATMOSPHERE) -->
<div class="campus-25d-viewport" id="campus25dViewport">

    <!-- Atmosphere Horizon Gradient (Visible in 2.5D Mode) -->
    <div id="campusHorizonAtmosphere" class="campus-horizon-atmosphere pointer-events-none"></div>

    <!-- 2.5D Perspective Controls & Turn-by-Turn HUD -->
    {% include "components/map/campus25dMap.html" %}

    <!-- Map Toolbar (Zoom, Center, 2.5D Perspective Toggle) -->
    <div class="absolute top-4 right-4 z-20 flex flex-col gap-1.5 bg-white/90 backdrop-blur-md p-1.5 rounded-xl border border-slate-200/90 shadow-md">
        <button id="btnMapZoomIn" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm transition-colors" title="Acercar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
        <button id="btnMapZoomOut" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm transition-colors" title="Alejar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
        </button>
        <button id="btnMapResetView" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 flex items-center justify-center text-xs transition-colors" title="Centrar Mapa">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"></circle><circle cx="12" cy="12" r="3" stroke-width="2"></circle><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3m10-10h-3M5 12H2"></path></svg>
        </button>
        <button id="btnToggle25dQuick" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-brand-50 hover:text-brand-600 text-slate-700 flex items-center justify-center font-black text-[11px] transition-colors" title="Alternar Vista 2.5D Perspectiva">
            3D
        </button>
    </div>

    <!-- Active Building Popover -->
    <div id="bldgPopover" class="absolute z-30 bg-white rounded-xl shadow-2xl border border-slate-200 p-4 max-w-xs text-xs text-slate-800 hidden transition-all pointer-events-auto">
        <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
                <span id="popoverBadge" class="w-6 h-6 rounded-md flex items-center justify-center text-white font-extrabold text-xs"></span>
                <span id="popoverName" class="font-bold text-slate-900 text-sm leading-tight"></span>
            </div>
            <button id="btnCloseBldgPopover" type="button" class="text-slate-400 hover:text-slate-600">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="popoverFacilities" class="text-slate-600 text-[11px] space-y-1 mb-3 max-h-32 overflow-y-auto pr-1"></div>
        <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <button id="btnSetBldgOrigin" type="button" class="flex-1 py-1.5 px-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-[10px] text-center transition-colors inline-flex items-center justify-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                <span>Origen</span>
            </button>
            <button id="btnSetBldgDestination" type="button" class="flex-1 py-1.5 px-2 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-800 font-bold text-[10px] text-center transition-colors inline-flex items-center justify-center gap-1">
                <svg class="w-3 h-3 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                <span>Destino</span>
            </button>
        </div>
    </div>

    <!-- Official Campus Orientation Compass (Bottom-Left Viewport Overlay) -->
    {% include "components/map/compass.html" %}

    <!-- 3D Transformable Stage (CSS 3D perspective plane with lower-third anchor) -->
    <div class="campus-map-wrapper campus-3d-stage" id="campusMapWrapper">

        <!-- Official SVG 2D Vector Map Canvas (1200 x 850) with geometricPrecision anti-aliasing -->
        <svg id="officialCampus2dSvg" viewBox="0 0 1200 850" class="campus-svg-canvas" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
        <defs>
            <!-- Clean Elevation Shadow Filter for Buildings -->
            <filter id="bldgShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.2" />
            </filter>

            <!-- ClipPaths for Buildings (Sharp Architectural Facets Matching Official UAM Map) -->
            <clipPath id="clipBldgP">
                <rect x="250" y="80" width="220" height="48" />
            </clipPath>
            <clipPath id="clipBldgO">
                <path d="M 485 145 L 535 145 L 535 180 L 555 180 L 555 220 L 535 220 L 535 255 L 485 255 L 485 220 L 465 220 L 465 180 L 485 180 Z" />
            </clipPath>
            <clipPath id="clipRanchon">
                <rect x="475" y="280" width="45" height="26" />
            </clipPath>
            <clipPath id="clipBldgN">
                <path d="M 275 240 L 425 240 L 425 360 L 380 360 L 380 285 L 275 285 Z" />
            </clipPath>
            <clipPath id="clipBldgJ">
                <rect x="275" y="315" width="45" height="35" />
            </clipPath>
            <clipPath id="clipBldgD">
                <path d="M 330 315 L 372 315 L 372 350 L 365 350 L 365 362 L 337 362 L 337 350 L 330 350 Z" />
            </clipPath>
            <clipPath id="clipBldgA">
                <rect x="235" y="410" width="35" height="98" />
            </clipPath>
            <clipPath id="clipBldgC">
                <rect x="270" y="410" width="240" height="35" />
            </clipPath>
            <clipPath id="clipBldgB">
                <rect x="270" y="473" width="240" height="35" />
            </clipPath>
            <clipPath id="clipBldgE">
                <path d="M 440 508 L 476 508 L 476 715 L 491 715 L 491 735 L 425 735 L 425 715 L 440 715 Z" />
            </clipPath>
            <clipPath id="clipBldgH">
                <rect x="525" y="365" width="95" height="36" />
            </clipPath>
            <clipPath id="clipBldgM">
                <path d="M 545 425 L 590 425 L 590 443 L 605 443 L 605 477 L 590 477 L 590 495 L 545 495 L 545 477 L 530 477 L 530 443 L 545 443 Z" />
            </clipPath>
            <clipPath id="clipBldgG">
                <rect x="490" y="535" width="54" height="46" />
            </clipPath>
            <clipPath id="clipBldgF">
                <rect x="490" y="605" width="54" height="46" />
            </clipPath>
            <clipPath id="clipBldgK">
                <polygon points="250,545 305,545 330,590 315,620 250,620 250,580" />
            </clipPath>
            <clipPath id="clipBldgI">
                <path d="M 615 645 L 655 645 L 655 745 L 695 745 L 695 785 L 615 785 Z" />
            </clipPath>
            <clipPath id="clipJaguarCenter">
                <rect x="690" y="465" width="90" height="90" />
            </clipPath>
            <clipPath id="clipJaguarGym">
                <rect x="705" y="575" width="60" height="45" />
            </clipPath>
        </defs>

        <!-- Seamless Ground Base (covers background during 3D perspective tilt & 360 rotation) -->
        <rect x="-2000" y="-2000" width="5000" height="5000" fill="#e8ecf1" />

        <!-- Master Vector Camera Group: vector pan, scale(2.2), and bearing rotation calculated mathematically -->
        <g id="mapCameraGroup">

        <!-- ================================================================== -->
        <!-- 1. BASE CAMPUS GROUNDS & PERIMETER ROADS                           -->
        <!-- ================================================================== -->
        <!-- Background Ground -->
        <rect width="1200" height="850" fill="#e8ecf1" />

        <!-- Perimeter Access Drives (Lavender/Grey Roads) -->
        <g id="roadsLayer" fill="none" stroke="#c8cfde" stroke-linecap="round" stroke-linejoin="round">
            <!-- Top Road (Camino Segundo Acceso) -->
            <path d="M 60 70 L 1140 70" stroke-width="26" />
            <!-- West Entrance Road (Tercer Acceso) -->
            <path d="M 120 70 L 120 220 L 70 240 L 70 650" stroke-width="24" />
            <!-- South Entrance Main Access Road -->
            <path d="M 70 650 L 320 780 L 720 780 L 1140 780" stroke-width="26" />
            <!-- Internal Loop to Edificio P & O -->
            <path d="M 240 70 L 240 220 L 520 220 L 520 330" stroke-width="16" />
            <!-- Internal Loop to Sports Area & Edificio I -->
            <path d="M 520 220 L 880 220 L 880 720 L 520 720" stroke-width="18" />
            <!-- Road between C/B and E/F/G -->
            <path d="M 410 440 L 410 650 L 660 650" stroke-width="14" />
        </g>

        <!-- ================================================================== -->
        <!-- 2. PARKING AREAS & LANDSCAPING TREES                               -->
        <!-- ================================================================== -->
        <g id="parkingLayer">
            <!-- West Parking Bay -->
            <rect x="75" y="270" width="125" height="340" rx="8" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- South Main Parking -->
            <rect x="250" y="660" width="360" height="95" rx="8" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- North Parking (near Copernicus P) -->
            <rect x="270" y="90" width="150" height="40" rx="6" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- North Parking (near Baseball Stadium) -->
            <rect x="580" y="90" width="130" height="40" rx="6" fill="#dfe5ec" stroke="#cbd5e1" stroke-width="1.5" />

            <!-- Parking Row Stripes -->
            <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,6" opacity="0.6">
                <line x1="90" y1="320" x2="180" y2="320" />
                <line x1="90" y1="380" x2="180" y2="380" />
                <line x1="90" y1="440" x2="180" y2="440" />
                <line x1="90" y1="500" x2="180" y2="500" />
                <line x1="90" y1="560" x2="180" y2="560" />
                <line x1="280" y1="710" x2="580" y2="710" />
            </g>

            <!-- Circular Landscape Trees (Matching Official Signage Rows) -->
            <g id="treeCanopyLayer" fill="#475569" opacity="0.85">
                <!-- Row on West Parking -->
                <circle cx="85" cy="490" r="10"/><circle cx="110" cy="490" r="10"/><circle cx="135" cy="490" r="10"/><circle cx="160" cy="490" r="10"/><circle cx="185" cy="490" r="10"/>
                <circle cx="85" cy="570" r="10"/><circle cx="110" cy="570" r="10"/><circle cx="135" cy="570" r="10"/><circle cx="160" cy="570" r="10"/><circle cx="185" cy="570" r="10"/>
                <!-- Row on South Entrance -->
                <circle cx="280" cy="740" r="11"/><circle cx="310" cy="740" r="11"/><circle cx="340" cy="740" r="11"/><circle cx="370" cy="740" r="11"/><circle cx="400" cy="740" r="11"/><circle cx="430" cy="740" r="11"/><circle cx="460" cy="740" r="11"/><circle cx="490" cy="740" r="11"/>
                <!-- Trees near Sports & Baseball -->
                <circle cx="560" cy="220" r="12"/><circle cx="560" cy="255" r="12"/><circle cx="560" cy="290" r="12"/><circle cx="560" cy="325" r="12"/>
                <circle cx="560" cy="480" r="12"/><circle cx="560" cy="515" r="12"/><circle cx="560" cy="550" r="12"/>
            </g>
        </g>

        <!-- ================================================================== -->
        <!-- 3. SPORTS FACILITIES (BASEBALL, SOCCER, JAGUAR COMPLEX)           -->
        <!-- ================================================================== -->
        <g id="sportsComplexLayer">
            <!-- 3A. ESTADIO DE BÉISBOL / BASEBALL STADIUM -->
            <g id="baseballStadium" class="bldg-shape" data-node="sportsZone" data-bldg="BÉISBOL">
                <!-- Stadium Outer Boundary -->
                <rect x="640" y="80" width="230" height="175" fill="#f1f5f9" stroke="#253452" stroke-width="2" />
                <!-- Outfield Grass (Solid Green Sector Arc) -->
                <path d="M 665 210 L 665 115 A 120 120 0 0 1 825 115 L 825 210 Z" fill="#22c55e" />
                <!-- Infield Dirt Diamond (Solid Clay Brown) -->
                <polygon points="745,120 780,155 745,190 710,155" fill="#c28854" stroke="#ffffff" stroke-width="2" />
                <!-- Infield Grass Center -->
                <polygon points="745,133 768,155 745,177 722,155" fill="#16a34a" />
                <!-- Pitcher's Mound -->
                <circle cx="745" cy="155" r="3.5" fill="#ffffff" />
                <!-- Bases: Home, 1st, 2nd, 3rd -->
                <rect x="743" y="188" width="4.5" height="4.5" fill="#ffffff" transform="rotate(45 745 190)" />
                <rect x="778" y="153" width="4.5" height="4.5" fill="#ffffff" transform="rotate(45 780 155)" />
                <rect x="743" y="118" width="4.5" height="4.5" fill="#ffffff" transform="rotate(45 745 120)" />
                <rect x="708" y="153" width="4.5" height="4.5" fill="#ffffff" transform="rotate(45 710 155)" />
                <!-- Stadium Label -->
                <text x="745" y="240" class="map-label" text-anchor="middle">ESTADIO DE BÉISBOL / BASEBALL STADIUM</text>
            </g>

            <!-- 3B. CANCHA DE FÚTBOL / SOCCER FIELD -->
            <g id="soccerField" class="bldg-shape" data-node="sportsZone" data-bldg="FÚTBOL">
                <!-- Pitch Outer Turf (Solid Pitch Green) -->
                <rect x="640" y="280" width="245" height="155" fill="#15803d" stroke="#253452" stroke-width="2.5" />
                <!-- White Pitch Markings -->
                <g stroke="#ffffff" stroke-width="2" fill="none">
                    <!-- Touchlines / Goal lines -->
                    <rect x="650" y="290" width="225" height="135" />
                    <!-- Halfway Line -->
                    <line x1="762" y1="290" x2="762" y2="425" />
                    <!-- Center Circle -->
                    <circle cx="762" cy="357" r="24" />
                    <circle cx="762" cy="357" r="2" fill="#ffffff" />
                    <!-- Left Penalty Box & Goal -->
                    <rect x="650" y="322" width="34" height="70" />
                    <rect x="650" y="337" width="15" height="40" />
                    <!-- Right Penalty Box & Goal -->
                    <rect x="841" y="322" width="34" height="70" />
                    <rect x="860" y="337" width="15" height="40" />
                </g>
                <!-- Field Label -->
                <rect x="695" y="410" width="135" height="16" fill="#0f172a" opacity="0.85" />
                <text x="762" y="422" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" class="map-label">CANCHA FÚTBOL / SOCCER FIELD</text>
            </g>

            <!-- 3C. JAGUAR SPORTS COMPLEX (CENTER, GYM, TENNIS COURTS) -->
            <g id="jaguarSportsComplex">
                <!-- Jaguar Center (Arena) -->
                <g class="bldg-shape" data-node="jaguarCenter" data-bldg="JAGUAR CENTER" filter="url(#bldgShadow)">
                    <g clip-path="url(#clipJaguarCenter)">
                        <!-- Base: #1da495 -->
                        <rect x="690" y="465" width="90" height="90" fill="#1da495" />
                        <!-- Lightning top slope: #48b2a9 -->
                        <polygon points="690,465 780,465 780,510 690,510" fill="#48b2a9" />
                        <!-- Shadow Left Triangle: #1f8383 -->
                        <polygon points="690,465 690,555 720,510" fill="#1f8383" />
                        <!-- Shadow Right Triangle: #1f8383 -->
                        <polygon points="780,465 780,555 750,510" fill="#1f8383" />
                    </g>
                    <!-- Navy Border: #253452, Sharp Corners -->
                    <rect x="690" y="465" width="90" height="90" fill="none" stroke="#253452" stroke-width="3.5" stroke-linejoin="miter" />
                    <text x="735" y="515" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" class="map-label">JAGUAR CENTER</text>
                </g>

                <!-- Jaguar Gym -->
                <g class="bldg-shape" data-node="jaguarCenter" data-bldg="JAGUAR GYM" filter="url(#bldgShadow)">
                    <g clip-path="url(#clipJaguarGym)">
                        <!-- Base: #1da495 -->
                        <rect x="705" y="575" width="60" height="45" fill="#1da495" />
                        <!-- Lightning top slope: #48b2a9 -->
                        <polygon points="705,575 765,575 765,597 705,597" fill="#48b2a9" />
                        <!-- Shadow Left Triangle: #1f8383 -->
                        <polygon points="705,575 705,620 725,597" fill="#1f8383" />
                    </g>
                    <!-- Navy Border: #253452, Sharp Corners -->
                    <rect x="705" y="575" width="60" height="45" fill="none" stroke="#253452" stroke-width="3.5" stroke-linejoin="miter" />
                    <text x="735" y="602" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" class="map-label">JAGUAR GYM</text>
                </g>

                <!-- Multipurpose / Tennis / Volleyball Courts -->
                <g class="bldg-shape" data-node="buildingL" data-bldg="CANCHAS">
                    <rect x="805" y="475" width="75" height="55" fill="#2563eb" stroke="#253452" stroke-width="3.5" stroke-linejoin="miter" />
                    <rect x="812" y="482" width="61" height="41" fill="none" stroke="#ffffff" stroke-width="1.5" />
                    <line x1="842" y1="475" x2="842" y2="530" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" />
                    <text x="842" y="542" class="map-sublabel" text-anchor="middle">CANCHAS / COURTS</text>
                </g>

                <!-- Grandstands (Graderías) -->
                <g>
                    <rect x="805" y="548" width="60" height="20" fill="#94a3b8" stroke="#253452" stroke-width="2" />
                </g>

                <!-- Building L Badge -->
                <g class="billboard-badge">
                    <rect x="860" y="465" width="18" height="18" class="badge-cyan" />
                    <text x="869" y="474" class="badge-text">L</text>
                </g>
            </g>
        </g>

        <!-- ================================================================== -->
        <!-- 4. OFFICIAL CAMPUS BUILDINGS (A, B, C, D, E, F, G, H, I, J, K...)   -->
        <!-- Flat architectural styling, solid teal roofs, sharp facet ridges   -->
        <!-- ================================================================== -->
        <g id="buildingsLayer">

            <!-- 4P. EDIFICIO P (COPÉRNICO) -->
            <g class="bldg-shape" data-node="buildingP" data-bldg="P" filter="url(#bldgShadow)">
                <g clip-path="url(#clipBldgP)">
                    <!-- Base: #1da495 -->
                    <rect x="250" y="80" width="220" height="48" fill="#1da495" />
                    <!-- Lightning top slope: #48b2a9 -->
                    <polygon points="250,80 470,80 470,104 250,104" fill="#48b2a9" />
                    <!-- Shadow Left Triangle: #1f8383 -->
                    <polygon points="250,80 250,128 274,104" fill="#1f8383" />
                </g>
                <!-- Navy Border: #253452, Sharp Corners -->
                <rect x="250" y="80" width="220" height="48" fill="none" stroke="#253452" stroke-width="3.5" stroke-linejoin="miter" />
                <!-- Badge P (Maroon) -->
                <g class="billboard-badge">
                    <rect x="430" y="92" width="22" height="22" class="badge-maroon" />
                    <text x="441" y="103" class="badge-text">P</text>
                </g>
                <!-- Labels -->
                <text x="340" y="108" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" class="map-label">EDIFICIO COPÉRNICO</text>
            </g>

            <!-- 4O. EDIFICIO O (FACULTAD DE INGENIERÍA Y ARQUITECTURA - FIA) -->
            <g class="bldg-shape" data-node="buildingO" data-bldg="O" filter="url(#bldgShadow)">
                <g clip-path="url(#clipBldgO)">
                    <!-- Base: #1da495 -->
                    <path d="M 485 145 L 535 145 L 535 180 L 555 180 L 555 220 L 535 220 L 535 255 L 485 255 L 485 220 L 465 220 L 465 180 L 485 180 Z" fill="#1da495" />
                    <!-- Lightning top slope: #48b2a9 -->
                    <polygon points="465,145 555,145 555,200 465,200" fill="#48b2a9" />
                    <!-- Shadow Triangles: #1f8383 -->
                    <polygon points="465,180 465,220 485,200" fill="#1f8383" />
                    <polygon points="485,255 535,255 510,235" fill="#1f8383" />
                </g>
                <!-- Navy Border: #253452, Sharp Corners -->
                <path d="M 485 145 L 535 145 L 535 180 L 555 180 L 555 220 L 535 220 L 535 255 L 485 255 L 485 220 L 465 220 L 465 180 L 485 180 Z" fill="none" stroke="#253452" stroke-width="3.5" stroke-linejoin="miter" />
                <!-- Badge O (Amber) -->
                <g class="billboard-badge">
                    <rect x="499" y="168" width="22" height="22" class="badge-amber" />
                    <text x="510" y="179" class="badge-text">O</text>
                </g>
                <text x="510" y="272" class="map-sublabel" text-anchor="middle">LAB. INGENIERÍA / CIAR</text>
            </g>

            <!-- Ranchón (Pavilion near O) -->
            <g class="bldg-shape" data-node="buildingO" data-bldg="RANCHON" filter="url(#bldgShadow)">
                <g clip-path="url(#clipRanchon)">
                    <rect x="475" y="280" width="45" height="26" fill="#1da495" />
                    <polygon points="475,280 520,280 520,293 475,293" fill="#48b2a9" />
                    <polygon points="475,280 475,306 488,293" fill="#1f8383" />
                </g>
                <rect x="475" y="280" width="45" height="26" fill="none" stroke="#253452" stroke-width="3" stroke-linejoin="miter" />
                <text x="497" y="320" class="map-sublabel" text-anchor="middle">RANCHÓN</text>
            </g>

            <!-- 4N. EDIFICIO N (CLÍNICAS MÉDICAS ODONTOLÓGICAS) -->
            <g class="bldg-shape" data-node="buildingN" data-bldg="N" filter="url(#bldgShadow)">
                <g clip-path="url(#clipBldgN)">
                    <!-- Base: #1da495 -->
                    <path d="M 275 240 L 425 240 L 425 360 L 380 360 L 380 285 L 275 285 Z" fill="#1da495" />
                    <!-- Lightning top slope: #48b2a9 -->
                    <polygon points="275,240 425,240 402,262 275,262" fill="#48b2a9" />
                    <polygon points="425,240 425,360 402,337 402,262" fill="#48b2a9" />
                    <!-- Shadow Triangles: #1f8383 -->
                    <polygon points="275,240 275,285 297,262" fill="#1f8383" />
                    <polygon points="380,360 425,360 402,337" fill="#1f8383" />
                </g>
                <!-- Navy Border: #253452, Sharp Corners -->
                <path d="M 275 240 L 425 240 L 425 360 L 380 360 L 380 285 L 275 285 Z" fill="none" stroke="#253452" stroke-width="3.5" stroke-linejoin="miter" />
                <!-- Badge N (Magenta) -->
                <g class="billboard-badge">
                    <rect x="290" y="251" width="22" height="22" class="badge-magenta" />
